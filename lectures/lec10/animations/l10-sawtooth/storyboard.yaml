# Storyboard — clip l10-sawtooth   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l10-sawtooth
title: Keep it under the cap
lecture: 10
section: "8.4 The sawtooth and its two knobs"
status: reviewed
why_motion: >
  Accumulation plus a periodic drop, with a rate knob that changes the shape. The sawtooth is itself a time series:
  usage climbs while writes arrive and drops when merge and compaction runs. The lesson is what the merge rate does
  to the peaks against a hard 1 TB cap: the same writes, merged half as often, climb into the cap and crash the store;
  merged twice as often, the peaks stay low but the CPU is busy merging. A still graph shows one shape, not the same
  writes producing a crash when only the merge rate changes.
static_twin: "Fig 8·c (D-15 right half, b_022500.jpg; D-20 graph, b_023515.jpg): usage plot under a red 1 TB cap"
ledger:
  taught: [L-0244, L-0245, L-0246, L-0247, L-0248]
  context_only: [L-0236, L-0238, L-0241]
fidelity_notes:
  - "The only number is the board's 1 TB cap (L-0245). Write rate, merge intervals, drop depth and the time axis are illustrative and unlabelled; the time axis carries no units."
  - "All three runs use the same write rate (the same slope); only the merge interval changes (healthy P, too often P/2, too rarely 2P). That is the clip's one controlled variable."
  - "After each merge, usage drops to the live data, drawn as a flat floor (not labelled). The clip doesn't claim how the floor moves over time; every run starts at that floor."
  - "Too rarely: the first peak (at twice the healthy interval) reaches the cap before its merge runs, and the line stops there with a red ✕ and 'disk full: crash'. 'Crash' follows L-0245's merged verbatim ('As soon as it crosses the cap of it, your system would crash') and the outline's wording."
  - "'CPU spent merging' is a qualitative bar (L-0246: 'too much garbage collection ... your CPU not getting CPU to do actual work'). It grows by one equal chunk per merge, so it counts merges: 3 healthy, 7 too often, 0 too rarely. No percentages and no claim about the cost of one merge."
  - "The rotation threshold is named, not animated: the class gave no rule for how it changes the shape (L-0247). Real Bitcask triggers merges by how much garbage exists (A-SSE-04); that sits in the prose next to the clip, not on screen."
  - "L-0247 is fact-checked as 'simplified' (real Bitcask exposes many more settings). The caption says 'This design has two knobs', not 'only two knobs'; the board's notes '1. MC freq' and '2. file rotation threshold' are shown as written (split over two lines)."
  - "'work piles up' (L-0246) is in the B3 caption only, not drawn as a label, to keep the plot free of labels crossing ghosted lines."
  - "The usage lines are graphite (they are not a request path); red marks only the cap, the curve that hits it and the crash."
