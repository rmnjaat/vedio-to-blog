# Storyboard — clip l10-scan-vs-index   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l10-scan-vs-index
title: Half a terabyte, or one line
lecture: 10
section: "2.2 A one-level index"
status: reviewed
why_motion: >
  Accumulation / rate. The lesson is how much each lookup reads on the way to the answer: the scan's byte counter
  climbs through half a terabyte, and the next request pays it all again, against one short sweep of a small index
  and one pointed read. Two stills can mark where each read ends, not how much each one touched on the way.
static_twin: "Fig 2·b (D-02 redraw, b_003545.jpg): index.dict left, data.dict right, 1 TB; Fig 2·a (D-01, the scan)"
ledger:
  taught: [L-0042, L-0043, L-0044, L-0047, L-0048, L-0050, L-0051, L-0063]
  context_only: [L-0049, L-0045, L-0022, L-0012]
fidelity_notes:
  - "The file is unsorted at this point (L-0022), so ball's place is illustrative ('about halfway down'): that makes the scan the average case of L-0044 (half a terabyte), with the worst case (the whole 1 TB) marked by a dashed extension."
  - "The counter is bytes, not seconds: no latency number is claimed. The first two counter values (14 B, 34 B) are the page's own byte offsets (apple at 0, amazon at 14, Fig 2·b, factcheck_applied 'Byte offsets in the example'); after that the counter is tied to the cursor's place in the file, ending at about 500 GB at ball (L-0044)."
  - "The drawing is not to scale: rows stand for lines, the ⋮ rows for the ~85,000 lines skipped; the counter carries the size."
  - "The second request's scan runs faster on screen than the first: it is the same scan, shortened so the clip stays under 30 s. Speed on screen does not encode time anywhere in this clip."
  - "The index is drawn as a FILE scanned line by line (L-0050), as the class had it in 2.2. The in-memory map arrives in 2.3, after the clip, and is not shown. L-0063 is used only for 'a direct pointed read at the offset', which holds for both."
  - "The index's size (1.75 MB, L-0058) is not shown (computed in 2.3; SN-02 revises it to ~2.4 MB with 8-byte offsets). The index label says only 'keys + offsets only'. No '4-byte' appears (SN-02, L-0051 inline clarification)."
  - "ball's offset in the index is written '…' (no invented number). Offsets are byte positions (L-0049): the caret on data.dict is labelled 'byte offset'."
  - "Disk wear (L-0045) is not claimed on screen; it stays in prose with its clarification."
  - "Frame 0 is Fig 2·b without its three pointer arrows and with index.dict ghosted at 38% (the scan comes first); the board's o1/o2 become byte offsets 0 and 14, as on the page."
