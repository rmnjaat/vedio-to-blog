# Storyboard — clip l10-garbage-vs-rolling   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l10-garbage-vs-rolling
title: Same path vs a rolling deployment
lecture: 10
section: "6.4 A reload is a boot: trigger a deployment"
status: reviewed
why_motion: >
  A window in time against a gradual handover. At the same path the harm is a window: it opens at the swap and closes
  only when the last server reloads, and every answer inside it is garbage. With a new path and a rolling deployment
  the inconsistency is also temporal (old and new answers side by side for a while) but never wrong. Two stills of the
  end states look alike (every server on the new file); only time shows the red window and its absence.
static_twin: >
  StepThrough Fig 6·a (same path, D-09 b_012615.jpg) and Fig 6·d (the update end to end, D-06 b_014315.jpg); the
  index-version tags on the api boxes come from D-10 panel 2 (b_012642.jpg, purple hatched tag = index version).
ledger:
  taught: [L-0157, L-0158, L-0159, L-0161, L-0177, L-0178, L-0183, L-0184, L-0196]
  context_only: [L-0153, L-0160, L-0166, L-0129]
fidelity_notes:
  - "S3 overwrites are atomic (L-0153 inline clarification, A-D-05): the top lane swaps the file's content in one move (the v2 tag lands, v1 is replaced); no half-uploaded file is drawn. The garbage comes only from stale offsets (L-0158), the danger the lecture names. Upload failure / corruption (L-0157's other problems) are left to the prose."
  - "v1 / v2 are illustrative tags for last week's and this week's file and for the index built from each (L-0158 'last week's offsets'; the board's D-10 draws an index-version tag on every API box). No version numbering is claimed for the real system."
  - "File names dict1 / dict2 follow Fig 6·c panel 2 and board D-06 (s3://wd/dict1.dict, dict2.dict, L-0161). The top lane keeps the name dict1 for the new content: that IS the same path."
  - "Each answer bar is the stream of answers one server gives to GET apple over time (L-0158 example). Old answers 'a fruit' and new 'a round fruit' are the board's meanings (L-0129); the garbage answer is drawn as a red bar with a ✕ and the word 'garbage', not a real byte string. The caption carries 'land in another word' (L-0158)."
  - "Reload / replacement times are staggered and unnumbered (each server's next reload, L-0159/L-0160; one server at a time in the roll, L-0183). The two lanes use the same time scale and the same three moments, so the posters compare directly. No poll interval, no seconds, no request counts."
  - "The time track starts at the switch (the upload for the top lane, the deploy trigger for the bottom lane) and is labelled 'time →' (no room for '(not to scale)' beside the lane labels; the page says it). Time is not to scale and is not numbered; the playhead pauses at a beat boundary (no claim)."
  - "Old servers in the bottom lane answer 'a fruit' in graphite, not red: their index matches dict1, which is still there (L-0184). Stale index tags in the top lane are re-inked red at the swap (figures.md: red = stale offsets)."
  - "The rolling deployment replaces one server at a time with the LB in place (L-0183). Whether the platform launches the new server before terminating the old (A-D-14) is in the prose, not drawn; the clip draws only 'old box out, new box in'."
  - "The update job's merge step is not drawn (Fig 6·d step ①); the clip shows the order upload → meta.json → deploy (L-0196) as three successive events with the caption naming them in order."
  - "'Eventually consistent' is L-0184's word, used in the last caption only. NOT claimed: the S3 ETag/If-Match guard (A-D-04), Pub/Sub, reload endpoints, how long a deployment takes."
