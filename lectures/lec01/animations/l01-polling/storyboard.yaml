# Storyboard — clip l01-polling (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l01-polling
title: Hearing ready
lecture: 1
section: "5.3 Short polling, long polling, push"
status: reviewed     # draft | approved | built | reviewed
why_motion: >
  The lesson is who talks when, and how requests pile up while nothing changes: a repeated protocol on one
  time line. A still can list the three patterns; only motion shows short polling asking again and again and
  getting the same answer, the long poll sitting held for the whole wait, the push connection idling, and then
  all three hearing "ready" at the same moment with very different request counts.
static_twin: "Fig 5·b (short polling), 5·c (long polling), 5·d/5·e (WebSockets / SSE); boards D-16..D-19"
ledger:
  taught:
    - L-0238  # short polling: the client asks again and again, periodically
    - L-0243  # every 10 s -> 6 requests a minute; 1M users -> 6M requests a minute
    - L-0245  # the response often doesn't change: redundant "in progress" answers
    - L-0246  # long polling: the request is not answered until the state changes
    - L-0248  # fewer requests; the server holds/does more (shown as a held request, no loop)
    - L-0250  # short polling answers at once; long polling waits until ready
    - L-0256  # with an open connection the server can send first
    - L-0265  # SSE: one persistent connection, the server sends; the client only opens it
  context_only:
    - L-0244  # per-request HTTP overhead (SN-20 in prose)
    - L-0247  # you build polling yourself
    - L-0249  # cricket long poll, "infinite loop" (fact-check nuance in prose)
    - L-0254  # WebSocket = persistent bidirectional connection
fidelity_notes:
  - "60 s is an illustrative job length (the class used an EC2 launch that takes 'an hour'); the opening caption says 'Say a job is ready at 60 s'. The 10 s interval and 1M readers -> 6M requests a minute are the class's numbers (L-0243)."
  - "Fact-check SN-20 / L-0244: no TCP handshake or teardown is drawn per poll. Each poll is one request and one reply (an HTTP/1.1 client would normally reuse one keep-alive connection for them). The cost shown is the request count, which is the lecture's point."
  - "Fact-check L-0248/L-0249: the long poll is drawn as a request the server parks (held, dotted) and answers when the job is ready. No server loop is drawn. The board's 'timeout -> reconnect' is not shown because the example wait is shorter than a typical timeout; it stays in prose (Fig 5·c footer)."
  - "6M is '6 million requests per minute' (about 100k a second), not 'concurrent requests' (fact-check note on L-0243)."
  - "The push lane is labelled 'websocket / sse' and doesn't claim which one Medium uses. The browser's 'connect' is drawn as one blue request; the counter says '1 connection', not '0 requests'."
  - "Round trips are drawn as narrow V's (request down, reply back up) and the playhead slows while each one is drawn: time is not to scale around the polls."
