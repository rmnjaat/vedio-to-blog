# Storyboard — clip l01-cascade (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l01-cascade
title: Cascading failure
lecture: 1
section: "2.4 Scaling the database"
status: reviewed     # draft | approved | built | reviewed
why_motion: >
  Cascade + accumulation. Load piles up first (a fleet widens, five query streams converge, the
  database's load climbs to the top), and only then does failure travel *backwards*, hop by hop:
  database → API servers → readers. A still shows only the end state; the clip shows the order —
  the untouched database fails first and takes everything above it down — which is why the rule
  that follows is "scale bottom up".
static_twin: "the page's CascadePoster (end state, site/src/figures/lec01/scaling-db.tsx) and board D-05 (b_004600.jpg); frame 0 is the pre-campaign row reader → lb → api → db"
ledger:
  taught:
    - L-0099  # horizontal scaling's catch: extra requests the API servers accept are forwarded to the DB, which goes down if not prepared
    - L-0101  # cascading failure: one component going down takes down those that depend on it, until users can't use the platform
    - L-0102  # DB is the most critical and brittle component: if the DB goes down, everything is down
    - L-0100  # final caption only: scale bottom up (DB first, then API servers)
  context_only:
    - L-0092  # campaign spike context (prose before the clip)
fidelity_notes:
  - "×5 is the sample page's illustrative fleet size (Fig 2·c: 100 rps → ×5), not a class number. No rps, latency or connection numbers appear on screen."
  - "The 'load' fill inside the database is a qualitative gauge (no scale, no units). It stands for 'the DB can't handle that many concurrent requests' (L-0099 board text)."
  - "'Queries queue, then time out' is our wording of how an overloaded DB fails its callers; the lecture says the DB 'goes down' and dependents fail with it (L-0099, L-0101)."
  - "Not claimed: any share of outages. L-0101's 'most major outages' is softened per the fact-check (a major cause, SRE book); that stays in prose — the clip makes no frequency claim."
  - "Reader icons are 'readers' (Medium case); three figures stand for the spike, not a count."
