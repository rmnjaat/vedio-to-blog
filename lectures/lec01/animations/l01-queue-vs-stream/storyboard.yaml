# Storyboard — clip l01-queue-vs-stream (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l01-queue-vs-stream
title: Queue vs stream
lecture: 1
section: "3.5 Message streams"
status: reviewed     # draft | approved | built | reviewed
why_motion: >
  Ordering / position over time. "Deleted when read" versus "kept, with independent positions" is a
  difference in behaviour, not in shape: the queue's pipe empties as consumers take and delete
  messages, while the stream's messages stay put and two cursors move over them at different speeds.
  The decisive moment — one consumer stalls (Elasticsearch down) while the other keeps going, then
  catches up — exists only in time.
static_twin: "Fig 3·d (queue) and Fig 3·f (stream); board D-11 final form (b_012030.jpg): queue pipe fanning out to three consumers above, stream pipe holding five squares with Search/Analytics hanging off their own squares below"
ledger:
  taught:
    - L-0155  # queue: homogeneous consumers (all do the same thing) → three identical `count++` boxes
    - L-0161  # a message read from a queue goes to exactly one consumer
    - L-0170  # queue = homogeneous consumers; stream = heterogeneous (search + counter on the same messages)
    - L-0173  # queue: read, process, delete; stream: consumers iterate, nobody deletes
    - L-0174  # stream messages stay until the retention policy deletes them
    - L-0175  # each consumer type iterates at its own pace
    - L-0176  # Elasticsearch down → the counter keeps processing
    - L-0213  # queue: you delete (stream: commit — the commit half is left to §3.7 prose)
  context_only:
    - L-0159  # queue walkthrough order m1→consumer 2, m2→consumer 1, m3→consumer 3 (used for dispatch order)
    - L-0168  # streams (Kafka, Kinesis) as the answer to the two-writes problem
    - L-0178  # Medium with Kafka: search service + counter service consume at their own pace
fidelity_notes:
  - "Dispatch order m1→consumer 2, m2→consumer 1, m3→consumer 3 is the class's walkthrough (L-0159); m4→consumer 1 and m5→consumer 2 are our continuation (illustrative)."
  - "Consumer boxes are labelled `count++` to show they are homogeneous (the Medium total_blogs++ example of §3.3); the lecture calls them consumers."
  - "Queue exclusivity is drawn as taught (L-0161). The at-least-once caveat (SN-11: SQS standard queues can redeliver) stays in prose next to Fig 3·d; the clip does not claim exactly-once."
  - "Retention shows no number: L-0174 gives 40/60/100 days as examples 'up to you'; the Kafka 7-day default (A-DC-08) lives in prose. The on-screen label is just `retention`. Which messages expire (the two oldest) is illustrative."
  - "Cursor speeds and the moment Elasticsearch goes down are illustrative; the lecture gives no timings. Positions are shown, not offsets or commits (commit is §3.7)."
  - "Message order in the pipe: m1 entered first and sits at the right (the queue's exit end); stream cursors therefore iterate right → left, oldest to newest, following the numbers."
  - "Fact-check L-0170 nuance (streams can have one homogeneous group; queues can fan out via SNS/fanout exchanges) stays in prose."
