# Storyboard — clip l01-count-race (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l01-count-race
title: Lost increments
lecture: 1
section: "4.2 The lost update"
status: reviewed     # draft | approved | built | reviewed
why_motion: >
  An interleaving is a timing phenomenon: whether an increment is lost depends on the order in which two
  threads read and write. And the damage is an accumulation: a rare, silent loss that only shows as a wrong
  total after many rounds. A still can show one bad interleaving (Fig 4·b does); only motion shows the counter
  running, losses being stamped now and then without any error, and the same run landing on 2,000 once each
  increment is indivisible.
static_twin: "StepThrough Fig 4·b (two lanes + shared row) and board S52 (b_014915.jpg: 'count should be += 2')"
ledger:
  taught:
    - L-0219  # two threads x 1000 count++ should give 2000, you get something like 1997: count++ is not atomic
    - L-0230  # Medium: two claps at the same time, 100 must become 102, not 101
    - L-0231  # protect the data with transactions or atomic instructions
  context_only:
    - L-0220  # "search why count++ isn't thread-safe" (MarginNote: read, add, write)
    - L-0221  # locks protect the critical section (prose, 4.3)
    - L-0223  # semaphore around count++ (prose, 4.3)
fidelity_notes:
  - "One story (QA fix, critic #4): part 1 is L-0230's two claps on a count of 100 (both read 100, both write 101, should be 102); part 2 is L-0219's run from 0 (1,000 count++ per thread, 'something like 1997'), labelled on screen 'from 0, 1,000 each'; the atomic replay lands on 2,000 and the closing note ties back to the claps: 2 claps on 100, atomic: 102. Matches the page caption and Fig 4·b (100 -> 101)."
  - "1,997 is the class's number ('something like 1997'); the caption says 'about 1,997'. The counter shows exactly 1,997 = 2,000 - 3 losses."
  - "Where the three losses fall on the track (14%, 52%, 83% of the run) is illustrative; the lecture gives no positions. The track is labelled 'time (sped up)'."
  - "read 100 / write 101 chips show count++ as read, add, write (L-0220; the decomposition is spelled out in the MarginNote)."
  - "The fix is drawn as one indivisible step labelled 'atomic +1' and names no language API or SQL. Locks/semaphores (L-0221, L-0223) and SN-19 (a transaction alone is not enough under READ COMMITTED) stay in prose."
  - "Not claimed: how often races happen in practice, or that the loss count is deterministic."
