# Storyboard — clip l05-redis-sampling (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l05-redis-sampling
title: Twenty keys at a time
lecture: 3          # course position "Lecture 03"; folder lec05
section: "4.2 Sampling 20 keys"
status: reviewed    # draft | approved | built | reviewed (render-checked 2026-10-13, see review.md)
why_motion: >
  Rate and accumulation, then a deliberate stop. The algorithm is a loop whose stopping is the lesson: it keeps
  sampling while a sample says "lots expired" and quits as soon as one says "few", leaving expired keys behind on
  purpose. A still (Fig 4·b) shows one sample; only the repetition shows the expired share falling round by round,
  the stop, and lazy deletion mopping up a leftover on its next read.
static_twin: "Fig 4·b (board S69 redraw): a field of 200 keys with a TTL, about 30% struck (expired); an empty dashed sample frame"
ledger:
  taught:
    - L-0244  # lazy deletion + periodic job, merged (B4 after the B1-B3 loop)
    - L-0243  # the periodic job does not delete every expired key (B3 leftovers)
    - L-0247  # sample 20 keys with an expiry, delete the expired ones in the sample (B1)
    - L-0249  # again if more than 25% of the sample was deleted, stop when fewer (log header, rows, B2)
    - L-0250  # the sample stands for the population (rings in the field mirror the tray; share label)
    - L-0251  # a low sample: delete those and stop; some expired keys remain, which is fine (B3, with 4/20 for 3/20)
    - L-0252  # speed over completeness: cleanup time is time not serving (B3 caption)
    - L-0301  # works only on the sample, never scans the database; some expired keys remain (B3)
  context_only:
    - L-0237  # lazy deletion itself (taught in 4.1; B4 shows it in one move)
    - L-0246  # the ~90% estimate (not animated)
    - L-0253  # single thread (SN-13): the clip says "time not serving", not "no threads anywhere"
    - L-0254  # memory bound (not animated)
fidelity_notes:
  - "Classic rule first, current rule last (SN-12, A-KSD-11): the loop shows the lecture's rule (20 random keys, again while > 25%). The poster adds a boxed note 'since 6.0: again above ~10%, in a time budget'. The clip never silently swaps the rules."
  - "Example numbers (caption B0 says 'Example'): 200 keys, 59 expired (about 30%); rounds of 7/20 = 35%, 6/20 = 30%, 4/20 = 20%. Values avoid exactly 25%. The lecture's own example is 3/20 = 15% (L-0251); the clip's last round, 4/20 = 20%, is the same case (below the threshold: delete and stop)."
  - "After three rounds 42 of 183 keys are still expired: the label says '≈ 23% still expired'. That is the arithmetic of the example, not a claim about Redis; L-0301's 'not more than 25%' is softened by the fact-check to a probabilistic estimate, so the clip states no bound."
  - "The three samples are drawn without overlap so each round's 20 keys are distinct on screen; real sampling may pick a key twice."
  - "Deleted keys turn into green ticks (freed), as in Fig 4·b. Expired keys are graphite-struck squares; in B3 the leftovers are re-inked red (stale), the strike is the second cue."
  - "B4: a blue GET reaches one leftover and it is deleted on the spot (L-0237). The client and its 'key does not exist' reply are left to the prose of 4.1."
  - "Not claimed: the central limit theorem (L-0255, unverified), '5 million keys' (L-0256), the 90% estimate (L-0246), 'no threads anywhere' (L-0253, SN-13), any timing, any memory share (L-0254)."
additions:
  - {fact: "Since Redis 6.0 the active-expire cycle keeps going while more than about 10% of a batch is stale, within a CPU time budget (A-KSD-11, SN-12)", source_url: "https://raw.githubusercontent.com/redis/redis/unstable/src/expire.c", checked: 2026-10-13}
