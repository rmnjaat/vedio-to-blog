# Storyboard — clip l05-expiry-window (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l05-expiry-window
title: Expired, hidden, then gone
lecture: 3          # course position "Lecture 03"; folder lec05
section: "3.7 The cleanup job and the last clause"
status: reviewed    # draft | approved | built | reviewed (render-check 2026-10-13, see review.md)
why_motion: >
  A window in time. Between a key's expiry and the next cron run its row is still on disk, so the same GET returns
  v1 at 12:01 and nothing at 12:04 only because the clock moved past expired_at. A still (Fig 3·d) shows one instant;
  only the timeline shows a read falling inside the window, a delete arriving after expiry (and writing nothing), a
  delete of a live key marking it -1, and one sweep removing all three rows.
static_twin: "Fig 3·d (board D-07, frame b_020700.jpg): clock axis with cron runs at 12:00 and 12:10, the store table behind the api"
ledger:
  taught:
    - L-0236  # approach 1: a cron job every 10 minutes fires a hard delete (cron clocks at 12:00 / 12:10, B6)
    - L-0201  # reads must filter expired keys: the cleanup may not have run yet ("expired, still on disk")
    - L-0221  # GET: SELECT * FROM store WHERE key = k AND expired_at > now() (strip, B1/B3)
    - L-0222  # that clause saves the network IO of sending the expired value ("v1 not sent")
    - L-0199  # delete becomes UPDATE store SET expired_at = -1 WHERE key = k (strip line 1, k3's -1)
    - L-0258  # the delete adds AND expired_at > now(): soft-delete only a key not yet expired (strip line 3)
    - L-0259  # for an already-expired key that update does no disk IO ("no disk IO")
    - L-0263  # final queries: cleanup DELETE ... WHERE expired_at <= now(); GET with > now() (B6 strip)
    - L-0202  # one cleanup query matches expired and soft-deleted (negative) rows (B6, B7 caption)
  context_only:
    - L-0260  # "saves two disk IOs" (index on ttl) — prose only, no count on screen
    - L-0294  # prose
fidelity_notes:
  - "Column name: the board writes 'ttl' in the L-0258/L-0263 queries and 'exp_at' in L-0199; the clip shows one name, expired_at, throughout (the page's CodeBlock uses the same)."
  - "Plan change: animations.md gave k2 an expiry of 11:58, but with a cron run at 12:00 that row would already have been hard-deleted; k2 expires at 12:02 with k1."
  - "Key times (12:01, 12:02, 12:04, 12:05, 12:06, 12:30) are illustrative inside the class's 10-minute cron example (L-0236); no real timing is claimed."
  - "-1 (L-0199, factcheck note on L-0199): works only for an integer epoch column; the times shown in the table are a readable rendering. The column type is explained in §3.4 prose (A-KSD-09), not on screen."
  - "Keys with no TTL / NULL (A-KSD-08, factcheck on L-0258 / L-0263): not shown in the clip; the page's final-query card and SourceNote carry it. The clip only has keys with an expiry."
  - "Not claimed: the IO count (L-0260 'two' stays in prose), any value size, lazy deletion on read (chapter 4), any index behaviour."
  - "Board ordering: the cron is drawn as clocks at both ends of the axis; the 12:00 run is context (nothing to delete yet in the clip)."
