# Storyboard — clip l05-wait-vs-skip (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l05-wait-vs-skip
title: 120 passengers, two queries
lecture: 3
section: "2.5 Approach 5: SKIP LOCKED"
status: reviewed     # draft | approved | built | reviewed (see review.md)
why_motion: >
  Contention and accumulation. Both queries end on the same seat map (120 of 120, correct), so a still of the two
  results shows "no difference", which is exactly what the lecture overturns. The difference lives only in time: under
  FOR UPDATE a queue forms at every seat and every commit wakes the whole queue to re-check, so evaluations pile up
  and the time bar runs long; under SKIP LOCKED nobody queues, seats lock back to back and the bar barely grows.
static_twin: "StepThrough Fig 2·e (wait, signal, re-check with three transactions) and Table T2 (the numbers); terminal frames b_010030.jpg-b_010045.jpg (approach 4 timings) and b_010600.jpg (approach 5, took 147.4798ms)"
ledger:
  taught:
    - L-0112  # approach 4 (FOR UPDATE): all 120 seats filled, every run
    - L-0113  # seats booked in order; each transaction takes an exclusive lock, the others wait
    - L-0115  # first gets the lock, the rest wait; on commit the engine signals the waiters to re-evaluate; one gets the next row; and so on
    - L-0119  # approach 5 = approach 4 plus two words, SKIP LOCKED
    - L-0121  # approach 4 took 1.7 s; approach 5 147 ms, about one tenth, still all 120
    - L-0122  # SKIP LOCKED: still an exclusive lock, but a locked row is passed for the next matching row; nobody waits; rows locked back to back
    - L-0154  # with SKIP LOCKED the query is evaluated about 120 times in total
    - L-0155  # without it, worst case N(N+1)/2 evaluations inside the engine (N + (N-1) + ...)
  context_only:
    - L-0114  # misconception "all 120 got row 1" (prose in 2.4; B1's "one gets the lock; 119 wait" is consistent with it)
    - L-0123  # "10x faster just by adding skip lock" (prose after the clip; the clip says "in this demo")
    - L-0306  # SKIP LOCKED reads a page and moves to the next row without re-evaluating (MarginNote)
fidelity_notes:
  - "Playback is NOT to scale, and the screen says so ('slowed down', top right). The two runs play one after the other, as in class (approach 4 was run, then approach 5). The time bars ARE to scale with each other (same track, same start): 1.7 s (the class's figure, L-0121; on screen the runs printed 1.25 s, 1.73 s, 1.79 s) and 147 ms (terminal: took 147.4798ms). On screen the top run lasts ~14 s and the bottom ~6 s; the bars, not the playback, carry the ratio."
  - "Departure from animations.md: the plan had the two lanes racing at once with the top 'still grinding' while the bottom runs. Built sequentially instead, so only one thing moves at a time and each lane is one run, as in class. A time bar on a shared track replaces the running clocks (a clock reading 0.4 s mid-run would be an invented number)."
  - "Each bar grows in proportion to seats booked so far (each seat stands for an equal share of the run's time). The demo printed no per-seat timings; the clip shows none."
  - "The evaluation counter on the FOR UPDATE lane is the WORST case, written 'up to': all 120 evaluate, then 119 re-check after the first commit, 118 after the next ... 120 + 119 + ... + 1 = N(N+1)/2 = 7,260 for N = 120 (L-0155; the arithmetic is the page's, as in outline 2.4). The real count depends on timing."
  - "The SKIP LOCKED counter ends at 'about 120' (L-0154). Its lane shows dots passing locked seats and never a re-check: the instructor's later Q&A wording (L-0306) is that SKIP LOCKED does not re-evaluate the query; his in-demo word 'quickly re-evaluated' (L-0122) stays in the MarginNote."
  - "Re-check wording follows the fact-check of L-0115 (simplified/low, A-C-11): a woken waiter re-checks the row against its WHERE and moves on to the next free seat; the clip says 're-check', never 'the app re-runs the query'."
  - "Dots are symbolic: the waiting crowd is drawn as at most 12 dots for up to 120 passengers (drawn = ceil(12 x count / 120)); the SKIP LOCKED stream after the visible seats draws one dot per 4 passengers (wide) or 6 (phone). Labels and counters carry the real numbers."
  - "Who gets which seat is not shown (L-0117 is prose); dots are anonymous. Seats are drawn 1A..2F (wide) or 1A..1F (phone), then '…20F' (the demo's 20 rows x 6 seats, L-0112's terminal 1-A ... 20-F)."
  - "Waiting is graphite with an hourglass, never red (figures.md marker rule, L-0096). Green = lock granted (padlock + holder dot) and seat booked (green outline + tinted fill); blue = a query being evaluated (moving to its row, or re-checking). No red: nothing fails."
  - "'≈ 1/10 the time' and the caption's 'about ten times faster in this demo' trace to L-0121 ('one tenth of the time'); fact-check L-0123: the 10x is this demo's measurement."
  - "Not claimed: that SKIP LOCKED is always 10x faster; per-seat lock-wait times; which engine; that FOR UPDATE waiters busy-loop (they sleep until signalled, L-0163, prose)."
