# Storyboard — clip l07-four-routes   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l07-four-routes
title: Four banks, one request
lecture: 9            # course position (folder lec07)
section: "5.3 Four ways to route: a visit to the bank"
status: reviewed
why_motion: >
  A repeated protocol: the four ways differ in who sends the next message, to whom, and how many times the client
  itself has to go out. Fig 5·b shows the four paths at once; it cannot show the order of the hops or who initiates
  each one, which is exactly what tells forwarding (the desk walks it over) from redirect (you walk there yourself).
  The leg counter grows as each message lands, so the cost is counted in front of the reader, not asserted.
static_twin: "Fig 5·b (D-15 redraw): four quadrants, each a stick-figure client and three stacked desks c1–c3; proxy box in panel 1"
ledger:
  taught:
    - L-0249  # proxy = the peon at the door; you talk only to him (B1, `proxy`, `the bribe`)
    - L-0250  # smart client = the regular who walks to the right desk; the table lives in the client (B2, `kiwi → c2`)
    - L-0251  # no intermediate hop saves the bribe (network latency) (B2 `no middle hop`); a desk change must reach every client (B5 `stale`, B6)
    - L-0252  # forwarding: the nearest desk forwards, gets the answer, sends it back (B3)
    - L-0255  # redirect: "go to counter 13", you go there yourself; DNS (B4 `c1: go to c2`)
  context_only:
    - L-0248  # four ways, the bank analogy (the four panels; stated in 5.3 prose)
    - L-0245  # the key-range table (a,j) → c1, (k,t) → c2, (u,z) → c3: why kiwi lives on c2 (Fig 5·a)
    - L-0257  # pick your battles (RuleBox in 5.4; the clip ends on L-0251's trade-off instead)
fidelity_notes:
  - "The bank captions are the instructor's analogy (peon, regular customer, nearest desk, 'go to counter 13'). The redirect label says `c1: go to c2` (who answered, then what) because the clip's desks are c1–c3; the caption keeps the redirect wording."
  - "Leg and round-trip counts are the page's illustration of L-0251 ('no intermediate hop ... the bribe is network latency'), counted from the clip's own messages: proxy 4 legs, smart client 2, forwarding 4, redirect 4 with two client round trips. No latencies or milliseconds are claimed."
  - "The key `kiwi` and the range table come from Fig 5·a (D-14's (k,t) → c2). Which desk the forwarding/redirect client walks into first (c1, the 'nearest desk') is ours."
  - "Forwarding is not labelled IPFS or BitTorrent: the fact-check (L-0253, imprecise) notes their Kademlia lookups are iterative, closer to redirect. That clarification stays in the 5.3 prose."
  - "The forward c1 → c2 is drawn solid (a synchronous request, motion-style rule), where Fig 5·b's spec says dashed (the board's dotted curve). Told to the section writer."
  - "B5 shows only the smart client's cost of a topology change (L-0251). Nothing is claimed about how the proxy, forwarding or redirect panels learn of the change; they are ghosted in B5."
  - "The job moving from c2 to c3 is drawn as a dashed graphite move (data copied between desks); how a real cache moves data is §6, not claimed here."
  - "Each response pens its own line back to the sender, parallel to the request (Fig 5·b: blue out, green back), with a packet riding it, so every counted leg stays on the sheet (critic C-11). The redirect's answer 'go to c2' is graphite (neither failure nor success)."
  - "The proxy's links to c1 and c3 are headless wires; only proxy → c2 has a head, the one request it sends (critic C-11, matching Fig 5·b)."
