# Storyboard — clip l04-connection-pool (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l04-connection-pool
title: Where a heartbeat's time goes
lecture: 1          # course position 01 (folder lec04)
section: "4.3 Keep the connections open"
status: reviewed    # draft | approved | built | reviewed
why_motion: >
  A repeated protocol and what it adds up to. One write with five trips is a static sequence (Fig 4·b); the
  waste only shows when the same open/close overhead repeats write after write while the real work stays one
  request and one reply, the time bar piles up mostly hollow, and the database's new-connection counter climbs
  in one lane and stays at 0 in the other.
static_twin: "Fig 4·c (D-11: server, three pre-established lines, db) for the pool lane; StepThrough Fig 4·b (five trips) for the no-pool lane; board b_010530.jpg, b_012230.jpg"
ledger:
  taught:
    - L-0109  # three-way handshake + two-way teardown: five network trips for every call
    - L-0111  # a micro update: the database does the bare minimum; the time goes into connecting
    - L-0112  # pooling: don't shut the connection down, keep a bunch open and reuse them
    - L-0113  # three connections created on startup, kept handy; any query uses a free one
    - L-0114  # pick a free connection, mark it busy, fire the query: one request, one response
    - L-0115  # two benefits: faster API call, less load on the database, same number of queries
    - L-0116  # opening a connection is work for the database itself (counter on the db side)
    - L-0103  # 6 million requests a minute (B5 "six million times a minute")
  context_only:
    - L-0108  # heartbeat POST in; the API server opens a second TCP connection to the db
    - L-0129  # the gain is huge because each update is one row by primary key
    - L-0131  # with micro updates a pool is "always a great option"
fidelity_notes:
  - "Five trips (SYN, SYN-ACK, ACK; FIN, FIN/ACK) is the lecture's count (L-0109) and is drawn exactly that way. Fact-check L-0109/L-0111 (inline): a real connect also runs the database login (and TLS if used); the setup label says 'open + close: 5 trips' followed by '(+ db login)' so the clip never claims the cost is TCP only. No login trip is drawn, so the teacher's count stays as taught."
  - "Trip names SYN / SYN-ACK / ACK / FIN / FIN/ACK are the standard TCP names (RFC 9293), the same ones Fig 4·b uses; the lecture says 'three-way handshake ... two-way teardown'."
  - "No millisecond values anywhere (the lecture gives none). Every trip is one equal segment of the time bar: bar lengths are illustrative, labelled on screen 'time, not to scale'. The predict line's '1 ms' stays on the page, not in the clip."
  - "Writes run back to back in both lanes, one at a time. In the pool lane they rotate over lines 1, 2, 3, 1, 2 to show 'any free one' (L-0113); a real pool may hand out the same line each time."
  - "The db counter counts new connections the database had to accept (L-0116: the database reads the handshake packets). Pool lane: 0 new during the clip; its 3 were opened at startup (L-0113, labelled 'pre-established / at startup', the board's words)."
  - "B5's '6M new connections/min' is derived: 6 million writes a minute (L-0103) × one new connection per write without a pool (L-0108, L-0109). The pool lane says 'same 3, reused', not '0 new', because pools can stretch under load (4.5, not shown here)."
  - "Not claimed: memory savings (L-0117 and its inline note stay in prose), pool sizing / min / max / stretch (4.5), where the pool lives (4.4), any database product."
