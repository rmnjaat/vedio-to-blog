# Storyboard — clip l08-rr-vs-leastconn (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l08-rr-vs-leastconn
title: Why long requests pile up
lecture: 5            # course position; folder id lec08
section: "2.4 Least connections"
status: reviewed      # draft | approved | built | reviewed
why_motion: >
  Accumulation. Round robin's failure only appears over time: a long request keeps running while the rotation
  comes back round to its server and deals it another long one, while the other two servers empty out. A still
  shows one moment; the clip shows the long bars piling up on one server as the playhead runs, the connection
  counts drifting apart (3, 0, 0), and least connections keeping them level (1, 1, 1) from the same request stream.
static_twin: "StepThrough Fig 2·c (lanes per server, long request = long bar, counter per server) and Fig 2·b panel c; board D-02 (b_004000.jpg)"
ledger:
  taught:
    - L-0053  # round robin: requests go to the servers in turn (1, 2, 3, 1, 2, ...) -> top panel, note "its turn"
    - L-0070  # least connections: forward to the backend with the fewest connections from the LB -> bottom panel, note "fewest"
    - L-0072  # LB tracks active connections per backend; a finished request frees its connection -> live counters in every box
    - L-0074  # least connections forwards to the least burdened machine -> r7, r10 land on a free server
    - L-0075  # high variance: some requests take a second, some an hour -> short bars vs long bars that keep growing
    - L-0077  # blunt round robin under high variance piles long requests onto one already-busy server -> 3 long bars on s1, red ring, "long ones pile up"
    - L-0078  # very large variance in response times -> least connections -> closing caption, "spread out"
  context_only:
    - L-0076  # the teacher's 1-5 walkthrough: Fig 2·c StepThrough (the clip's own stream is longer)
    - L-0089  # ties broken at random (prose)
    - L-0079  # the LB sees only connections, not CPU (the "after" line, 2.5)
    - L-0090  # least connections is a local optimization (prose)
fidelity_notes:
  - "The request stream is illustrative: ten requests, 4, 7 and 10 long, the rest short. The lecture gives the mix as 'one second, one minute, one hour' (L-0075) and no stream; the clip names no durations. Long bars simply keep growing; short ones end after 50 frames (1.7 s) of clip time."
  - "The long requests (4, 7, 10) fall on every third arrival, so they line up with round robin's turn for s1. This is the case the teacher describes ('all long running requests were just getting bogged onto this one server', L-0077); it is not claimed that every workload lines up this way."
  - "Both panels are a real simulation of the two rules on the same stream (timeline.ts): round robin = next server in turn; least connections = fewest active connections at dispatch. Ties under least connections are broken by taking the next server in turn: one of the 'pick one at random' outcomes of L-0089 (and nginx's tie-break order, A-LBL-02); the clip does not show or claim a tie rule."
  - "One connection per request: a request's connection opens when it is forwarded and closes when it finishes (L-0072, L-0073). The fact-check's refinement (with keep-alive, an in-flight request, not an open connection, is what means busy: A-LBL-15) does not change what the clip shows, since each request here is one connection."
  - "Time runs left to right and is not to scale; the axis says 'time (not to scale)'. The playhead runs at a constant rate (it means time)."
  - "Not claimed: response times, queueing inside a server, CPU or memory (the LB never sees them, L-0079), that least connections is optimal (it is a local heuristic, L-0090)."
