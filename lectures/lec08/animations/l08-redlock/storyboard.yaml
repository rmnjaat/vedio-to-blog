# Storyboard — clip l08-redlock (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l08-redlock
title: Winning a majority
lecture: 5          # course position "Lecture 05"; folder lec08
section: "7.2 Redlock: a majority of five"
status: reviewed    # draft | approved | built | reviewed
why_motion: >
  Contention. Two clients race for the same lock on five independent nodes; who wins each node depends on the
  order the requests land, and the outcome (3 of 5 vs 2 of 5) only exists once all five have answered. The loser
  then has to give back what it took and retry later, and a node dying afterwards changes nothing for the holder
  while still blocking everyone else. Fig 7·a shows the end state; the clip shows how it is reached and why the
  loser's release matters.
static_twin: "Fig 7·a (D-10 redraw, b_022930.jpg): five redis cylinders r1..r5 in a row, no lines between them; clients wired to every node with SET NX"
ledger:
  taught:
    - L-0275  # a single Redis lock is a SPOF (B0 framing: five independent nodes instead of one; poster 'fault tolerant')
    - L-0278  # five fully independent Redis servers, no replication; try to acquire on all of them (B0, B1)
    - L-0279  # you own the lock only with more than 50% (3 of 5) (B2 '3/5 acquired', '2/5 failed')
    - L-0280  # failing the majority -> release what you got at once; keep retrying (B3, B4)
    - L-0281  # distributed locks cost throughput; used for correctness / fault tolerance (B5 'fault tolerant, not faster')
    - L-0282  # one node going down is no problem (B4: r2 down, C1 still holds, nobody else reaches 3 of 5)
  context_only:
    - L-0287  # distributing reduces throughput, buys fault tolerance (7.5 RuleBox; the poster note echoes it)
    - L-0314  # the two-holders edge case (StepThrough Fig 7·b in 7.3, deliberately not in this clip)
fidelity_notes:
  - "Five nodes, no replication, all independent: the board's words (D-10, L-0278); shown as a hand note, no lines between cylinders."
  - "Requests go to all five in parallel (L-0278 allows sequential or parallel; the Redis docs describe parallel). Arrival order and per-request latency are illustrative: they are chosen so C1 lands first on r1-r3 and C2 first on r4-r5. No latency numbers are shown."
  - "'took < TTL' next to C1's 3/5 is A-LDA-05 (sourced addition): the documented rule is majority AND time spent acquiring < lock validity. The clip shows no TTL value."
  - "'random delay' before the retry is A-LDA-06 (sourced addition). The loser releases the two nodes it got, as taught (L-0280); A-LDA-06's 'unlock all instances, even ones you think you missed' stays in the prose (placement: L-0280 left as taught, A-LDA-06 as a separate sentence)."
  - "The plan's third client C3 is replaced by C2's own retry after its random delay: one story, same point (with r2 down and C1 holding r1, r3, no one can reach three of five)."
  - "The winner does NOT keep grabbing r4 and r5 after it has a majority (SN-08 corrects L-0316); C1's paths to r4, r5 stay graphite."
  - "When r2 goes down its key is gone (c1 removed, red ✕). The clip claims only what L-0282 says: one node down is no problem for C1's lock. It does not show crashed nodes coming back empty (L-0314, the two-holders edge case, StepThrough Fig 7·b) and does not claim Redlock is foolproof."
  - "'r2 down later: C1 holds' (B4, kept on the poster) restates L-0282 on the figure: the 3/5 was won before r2 died, and losing one node does not undo it. No TTL or remaining-validity claim is made."
  - "Values c1 / c2 stand for each client's lock value (the random token of A-LDA-02 is in the prose)."
  - "'fault tolerant, not faster' paraphrases L-0281 (distributed locks take a toll on throughput; used where correctness and fault tolerance are required), echoed by L-0287 in 7.5."
additions:
  - {id: A-LDA-05, fact: "Redlock acquires only if a majority is locked AND the total time spent acquiring is less than the lock validity time", source_url: "https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/", checked: 2026-10-13}
  - {id: A-LDA-06, fact: "A client that fails to get the majority unlocks and retries after a random delay so competing clients do not keep colliding", source_url: "https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/", checked: 2026-10-13}
