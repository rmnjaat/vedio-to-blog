# Storyboard — clip l08-stale-config   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l08-stale-config
title: Nine seconds of errors
lecture: 5            # course position 05 (folder lec08)
section: "4.4 Getting the change to every LB server"
status: reviewed
why_motion: >
  A window in time. Between a backend's crash and the next 10 s poll, every LB server's in-memory copy is stale and
  requests keep going to the dead backend; the cost is the requests that fall inside that window. Only motion shows
  requests streaming into a dead backend while the copy is stale, then the same crash replayed with a push, where the
  window collapses to a sliver. A still shows the two brackets but not that the errors accrue for as long as the copy
  waits.
static_twin: "Fig 4·d 'Poll vs push' (D-04 timeline b_012245.jpg / b_015051.jpg + meta port b_012645.jpg); LB servers drawn as a stack as on D-06"
ledger:
  taught: [L-0154, L-0164, L-0167, L-0169, L-0170, L-0171, L-0174, L-0176]
  context_only: [L-0152, L-0166, L-0178, L-0181]
fidelity_notes:
  - "10 s poll and 'crash at the first second' (so 9 s) are the class's numbers (L-0169). The axis runs 0-12.5 s; time is slowed down and not to scale while events are drawn (the playhead pauses during the crash, the poll and the push). The lane says 'time slowed down'."
  - "The crash and the orchestrator's db update are drawn at the same moment (1 s): the lecture says the orchestrator updates the db 'immediately' when a check fails (L-0164). The health-check interval is not shown and no detection delay is claimed."
  - "The orchestrator removes b2's entry from the db, as taught (L-0164). Managed LBs mark targets unhealthy instead (A-LBL-03, simplified/low, left as taught in prose); the clip does not claim either is the only way."
  - "The LB servers are drawn as one stack ('lb servers', as on the board D-06); each server holds its own in-memory copy (L-0152), represented by one card 'b1 b2 b3'."
  - "Requests: one per second, round robin over b1 b2 b3, so every third goes to b2. The number of requests is illustrative; no count or error rate number is shown. Only requests sent to b2 fail (the page figure's dots inside the bracket that went to b2 are the red ones)."
  - "Push lane shows the meta-port option only (L-0171: orchestrator calls :9091, the LB server then pulls from the db). Pub/Sub and CDC (L-0178) are §4.5 and not shown; nothing about delivery guarantees is claimed (SN-03 sits in §4.5)."
  - "'near zero' / 'almost zero staleness' are the lecture's words (L-0174 'near immediate', L-0176 'almost zero staleness'); the sliver's width is not a measured number."
  - "Student 7's worry (polling adds load/latency) is not shown; the clip shows the teacher's main reason, staleness (L-0167 detail, L-0170)."
