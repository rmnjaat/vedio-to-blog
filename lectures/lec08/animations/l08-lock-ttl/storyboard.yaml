  c2_retry_bar: {shape: dashed server-box bar, label: "retries (ink2)", lane: consumer 2, span: "0 → 5.2 min"}
  c2_work_bar: {shape: server-box bar, label: "working", lane: consumer 2, span: "5.2 → 7.5 min"}
  ttl_box: {shape: dashed slot, label: "TTL 5 min (ink2)", lane: redis key, span: "0 → 5 min"}
