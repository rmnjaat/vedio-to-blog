# Storyboard — clip l08-lock-ttl   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l08-lock-ttl
title: A lock outlives its holder's time
lecture: 5            # course position 05 (folder lec08)
section: "6.6 Release: never delete a lock that isn't yours"
status: reviewed
why_motion: >
  A window in time plus interleaving. Two windows overlap on one time axis: consumer 1's work and the key's 5-minute
  TTL. The bug lives in their misalignment: the TTL drains while consumer 1 is unaware, consumer 2's retries are
  refused until the instant the key expires, and consumer 1's delete arrives late, after the key has changed hands.
  The StepThrough (Fig 6·d) shows the states; only motion shows the TTL running out under a holder that is still
  working and the late delete landing on someone else's lock.
static_twin: "StepThrough Fig 6·d 'Who deletes whose lock?' (lanes consumer 1 · redis key queue7 · consumer 2); board D-09 / S63-S64 (b_023554.jpg, b_022445.jpg)"
ledger:
  taught: [L-0257, L-0263, L-0264, L-0267, L-0268, L-0269, L-0270, L-0273]
  context_only: [L-0265, L-0271, L-0310]
fidelity_notes:
  - "'5 minutes / 300 s' is the class's number (L-0263, L-0264). Consumer 1 finishing at 6 minutes is the page's predict line (an illustrative overrun; the lecture only says it 'takes too long', L-0269). The axis runs 0-7.5 min and is labelled 'time (sped up)'; the playhead moves at one constant speed (24 f per minute) whenever it moves, and pauses while a command is drawn."
  - "Consumer 2 takes the lock at 5.2 min (its next retry after the expiry). Retries land once per minute: illustrative spacing, not a claimed retry interval. The fact-check notes a tight while-true loop hammers Redis (L-0267 simplified/low, left as taught); the clip shows a few spaced retries and claims nothing about the interval."
  - "The command is drawn in the one-command form SET queue7 c1 NX EX 300 (A-LDA-01, which the page weaves in next to L-0264). The lock value is shown as c1 / c2 for legibility; the page's prose carries A-LDA-02 (a random token unique per lock request)."
  - "Replies are the documented SET replies: OK when the key was set, nil when it was not (Redis SET docs; the fact-check note on L-0265). The class said SETNX 'returns 1 / 0'; that wording is left as taught on the page (L-0265 simplified/low) and the clip does not repeat it."
  - "EVAL label 'EVAL: if get==c1: del' paraphrases the board's release_lock (v = redis.get(q); if v == consumer_id: redis.delete(q), 'EVAL executed atomically using LUA script', L-0273). It returns 0 when the key is not c1's (the documented release script's reply)."
  - "The replay (B5) re-runs only consumer 1's release; everything else on the axis is unchanged. The get-then-delete race in client code (L-0271) and fencing tokens (A-LDA-04) are NOT shown: they stay in the StepThrough and prose. The clip does not claim the owner check stops consumer 1 from still working."
  - "Lease extension (A-LDA-10, L-0310 context) is not shown."
additions:
  - {fact: "SET key value NX EX seconds sets the key and its expiry in one command; it replies OK if set and nil if not", source_url: "https://redis.io/docs/latest/commands/set/", checked: 2026-10-13}
  - {fact: "The documented safe release is a Lua script run with EVAL that deletes only if the value matches, else returns 0", source_url: "https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/", checked: 2026-10-13}
