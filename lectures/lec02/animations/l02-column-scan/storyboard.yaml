# Storyboard — clip l02-column-scan (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l02-column-scan
title: One average, two layouts
lecture: 4            # course position (folder lec02)
section: "3.2 One query, two layouts"
status: reviewed     # draft | approved | built | reviewed
why_motion: >
  The lesson is how much gets read per row: a rate. A still can mark which cells are read; only the sweep shows
  the row store's read head passing over every unneeded cell of every row (and, slowed down, why it cannot skip:
  it has to reach the row boundary), while the column store reads two files and the other three stay untouched.
  Widening the table to 100 columns then grows the row store's read and leaves the column store's alone.
static_twin: "Fig 3·a (D-01 redraw: stock_ticks header, row strips R1–R3, column blocks) and Fig 3·b (one file per column)"
ledger:
  taught:
    - L-0053  # row store: a row's five columns are stored together, so even a two-column select reads the whole row
    - L-0056  # the query SELECT avg(price) WHERE ts = '…'; board frames it as a 100-column table
    - L-0057  # about 10,000 listed companies, about 10,000 rows for the day; each row read, price and ts picked
    - L-0058  # symbol, name, exchange read for nothing; board: "reading all columns & discarding 98 of them"
    - L-0059  # it must pass over them: without the row boundary it can't pick the next row's columns
    - L-0062  # column store reads only the price and timestamp files; no IO for symbol, name, exchange
  context_only:
    - L-0055  # the "very naive" one-file-per-column model behind the lower lane (labelled "(naive)")
    - L-0052  # the stock_ticks table and its five columns
    - L-0071  # naming columns in SELECT still reads every column in a row store (prose + P1)
fidelity_notes:
  - "Counters count columns read, not bytes. No IO size, speed-up or compression is claimed; A-DC-11's 'about 5%' stays in prose."
  - "10,000 rows is the class's number (L-0057), drawn as three strips R1–R3 plus mono '× 10,000' under the row labels."
  - "The 100-column widening is the board's framing (D-01: 'a table with 100 columns', 'discarding 98 of them'). The strips keep their length and are subdivided into 100 thin cells: not to scale. price is put at column 2 and ts at column 100 (illustrative positions)."
  - "The column store is the class's 'very naive' one-file-per-column model (L-0055), labelled '(naive)' from frame 0. Files are drawn side by side (the board stacks them) so the five names fit; each file has three cells for R1–R3."
  - "B2's slowed replay runs on R3 (the plan said R2) so the 'row boundary' label has room under the strip end. The caption is L-0059 in plain words; no claim about fixed-width rows, pages or offsets."
  - "timestamp is written 'ts' everywhere, as the board's query does."
  - "The plan's 'values read: 50,000 / 20,000' counter was replaced by a per-row 'reads 5, uses 2' (then 'reads 100, uses 2'): no illustrative arithmetic on screen. The plan's B4 bars were replaced by the strips themselves widening to 100 cells, so the poster keeps the read pattern. The plan's B2 red flash became the slowed R3 replay to the row boundary (L-0059); the red hatch from B1 already marks the wasted cells."
  - "Dark theme: the wasted-cell hatch is inked heavier on the blackboard so it stays red; the two used columns in the 100-cell comb get a blue cap above and below the strip so they stay visible at phone size (their width is still one cell)."
  - "Not claimed: inserts, warehouses, compression, pricing (3.3–3.4); how a real engine lays out pages."
