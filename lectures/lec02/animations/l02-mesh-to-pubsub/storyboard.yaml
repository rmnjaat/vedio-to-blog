# Storyboard — clip l02-mesh-to-pubsub (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l02-mesh-to-pubsub
title: Mesh to Pub/Sub
lecture: 4            # course position (folder lec02)
section: "8.4 A real-time Pub/Sub in the middle"
status: reviewed      # draft | approved | built | reviewed  (render-check rounds: lectures/lec02/animations/l02-mesh-to-pubsub/review.md)
why_motion: >
  Accumulation, then redistribution. The mesh's cost is a growth rate: each new server must open one TCP link per
  server already there, and every link also takes a slot on every server. Watching the link counter and the red part
  of WS1's slot bar climb as servers arrive one at a time, and then everything collapse to one link per server, is
  the lesson. Fig 8·b step 3 and Fig 8·c show only the four-server state.
static_twin: "Fig 8·b step 1 end state (ws1 with A-D, ws2 with E, one tcp link) + Fig 8·c's slot bar; end state = Fig 8·d with five servers; boards D-05 (b_020445.jpg), D-06 (b_021900.jpg), D-13 (b_023009.jpg)"
ledger:
  taught:
    - L-0265  # every WS server has to be connected to every other: a mesh
    - L-0276  # the real overhead: 4 users + 3 peers = 7 connections, 3 only for inter-server traffic
    - L-0277  # the server's job is to serve users; the mesh wastes its connections on server talk
    - L-0278  # put a Pub/Sub in the middle: one connection per server instead of one to every other
    - L-0280  # overhead drops to one: A, B, C, D + one Pub/Sub connection
    - L-0281  # a real-time Pub/Sub sends to everyone subscribed right now
    - L-0282  # zero persistence: it keeps nothing, just pushes
    - L-0283  # flow: WS1 delivers to B, C, D locally, then sends to the Pub/Sub, which pushes to the subscribers
  context_only:
    - L-0242  # connection limit, assume four (the toy limit on the bar)
    - L-0258  # one plain TCP connection WS1-WS2 (B0's starting state)
    - L-0261  # F on WS3 (B1's third server)
    - L-0263  # "you have to do it, there is no other way" (prose / Fig 8·c bubble)
    - L-0284  # no delivery guarantee for a server not connected at publish time (clip l02-missed-message)
fidelity_notes:
  - "4 users per server is the class's toy limit (L-0242): a red cap tick after slot 4 with hand 'toy limit'. Real servers hold far more; the prose says so."
  - "The 7 connections, 3 of them for other servers, are the class's numbers for four servers (L-0276). The link counts 1, 3, 6, 10, the fifth server, and WS1's '4 + 4 = 8' are arithmetic from L-0265 (every server to every other), marked 'illustrative' beside ws5; the class drew four servers (D-05)."
  - "Only WS1's slot bar is drawn (Fig 8·c); the caption and alt say every link takes a slot on both ends, which is L-0276 applied to each server."
  - "No claim about ports: the limit is drawn as slots only (SN-06 corrects the ports claim in prose)."
  - "Users follow the board: B, A above ws1 and C, D at its left; E on ws2 (D-05); F on ws3 (L-0261). ws4 and ws5 have no users drawn (the board's fourth box is empty)."
  - "The push goes to every connected server, as 8.4 teaches it (L-0283: 'pushes it to everyone subscribed'); per-channel subscriptions come in 8.5 and are not shown, so ws4 and ws5 also receive the copy."
  - "Redis is labelled mono 'redis' + hand 'real-time pub/sub' (the board's 'Redis / Realtime PubSub'); no throughput or latency numbers. The glyph kit's broadcast tick on the pipe is left out (it would sit on the label); the pipe's dotted lanes stay empty, which is the 'keeps nothing' cue."
  - "No delivery guarantee (L-0284) is not shown: that is l02-missed-message's job."
  - "Not claimed: that a mesh is never used, how many servers Slack runs, or any number of real connections."
