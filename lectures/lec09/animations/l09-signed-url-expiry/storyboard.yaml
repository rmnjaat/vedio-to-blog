# Storyboard — clip l09-signed-url-expiry (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l09-signed-url-expiry
title: A forwarded URL, before and after it expires
lecture: 7          # course position 07 (folder lec09)
section: "5.2 Anatomy of a signed URL"
status: reviewed    # draft | approved | built | reviewed
why_motion: >
  A window in time. The same URL, in the same hands (C, who never asked the API server), works at minute 2 and is
  refused at minute 10; nothing about the person changes, only the clock. The playhead crossing the expiry mark is the
  lesson; a still shows either the working URL or the refused one, not that it is the same URL on one timeline.
static_twin: "Fig 5·b (URL anatomy: oh = hash, oe = expiry, most probably) and Fig 5·a (the copied URL opens for a non-follower); notes page '3. Privacy' (b_012057.jpg, b_013045.jpg)"
ledger:
  taught:
    - L-0162  # on the CDN, anyone with the URL can access the photo (C, not a follower, sees it at minute 2)
    - L-0164  # a follower copies the URL and sends it to a friend who doesn't follow: the friend sees the photo
    - L-0168  # the CDN has no authentication of its own, stateless: doesn't know B or C ('knows no one')
    - L-0169  # timed signature like JWT: expiry baked into the URL, a signature over it so no one can change it
    - L-0172  # privacy is enforced in the API server, which decides who gets the URL ('follows A?', 'decides who gets the URL')
    - L-0177  # expiry of, say, five minutes: requests after five minutes are not served
    - L-0178  # the check: CDN extracts the parameters, checks signature validity and expiry, image or bad url
  context_only:
    - L-0163  # board 'URL is short lived because certs are short lived' → SN-04 (expiry checked per request, however long the photo is cached)
    - L-0170  # oe 'most probably' the expiry, oh the hash (the instructor's guess; shown as 'oe: expiry (most probably)')
    - L-0171  # demo 'Bad URL timestamp' for removed parameters: left to prose/MarginNote, not attached to a case the class didn't show
fidelity_notes:
  - "The 5-minute expiry is the class's example (L-0177). Minutes 2 and 10 are illustrative readings; the track says 'time (sped up)'."
  - "oe is labelled 'oe: expiry (most probably)', keeping the instructor's hedge (L-0170). oh is shown on the tag but not named; the clip never shows how the signature is computed."
  - "The CDN's checklist says 'signature', not 'certificate' (fact-check inline clarification on L-0169)."
  - "'even with the photo still cached' (B4 caption) is the sourced addition A-CDM-13 / SN-04: the expiry is checked when each request arrives, however long the object stays cached. The photo stays in the cdn's slot (graphite) throughout."
  - "The refusal reads 'bad url' (the notes page and L-0178: 'otherwise it returns bad url'). The demo's literal 'Bad URL timestamp' (L-0171) was for removed parameters and is not shown. No HTTP status code is claimed (A-CDM-12's 403 stays in prose)."
  - "The tamper beat restates L-0169 ('so no one can change it'): C rewrites oe to 'oe=later' (illustrative value), the signature check fails, the expiry row is left unchecked (the check order follows L-0178: signature, then expiry)."
  - "The request is labelled mono 'GET /users/A/posts' (illustrative path for L-0172's '/post call'). The API's check reads 'follows A?'."
  - "The copy B → C is a dashed graphite path with the head at C (a copy, not a call; Fig 5·a). C never talks to the api."
  - "The fact-check nuance on L-0168 (CDNs do offer signed URLs / cookies / token auth; they are user-stateless, not access-control-free) is in the prose; the clip's 'knows no one' is the user-stateless half, and the checklist itself is the CDN's access control."
  - "Not claimed: signing keys, key groups, how long keys live, IP-bound policies, which CDN, real Facebook parameter names beyond oh/oe."
additions:
  - {fact: "The CDN checks the expiry when each request arrives, so a URL fails after its expiry however long the object stays cached.", source_url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-urls.html", id: A-CDM-13, checked: 2026-10-14}
