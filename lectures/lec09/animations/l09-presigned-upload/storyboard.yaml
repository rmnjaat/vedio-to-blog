# Storyboard — clip l09-presigned-upload   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l09-presigned-upload
title: The bytes leave your servers' path
lecture: 7
section: "3.3 The pre-signed URL"
status: reviewed
why_motion: >
  Accumulation, then its absence. One 5 MB upload through the API server is harmless; a steady stream of them,
  each crossing the server's network card twice, fills the card until other API calls wait. The fix is only visible
  in motion: the uploads keep coming along the new route, but the bar on the API server stops moving.
static_twin: "Fig 3·b row b (user ⇄ api ⇄ s3) + RuleBox §3 sketch (the long arc user → s3); board D-03 (b_013115.jpg)"
ledger:
  taught: [L-0068, L-0072, L-0076, L-0077, L-0078, L-0081, L-0082, L-0084, L-0085]
  context_only: [L-0079, L-0080, L-0083]
fidelity_notes:
  - "No money, egress or bill on screen: SN-01 (L-0079) says inbound internet traffic and same-Region EC2↔S3 transfer are free, so the clip claims bandwidth and transfers only. L-0078's '5 MB in, 5 MB out' versus one transfer is the class's arithmetic and stays."
  - "The prepare step draws NO call to S3: the URL is signed locally by the service (L-0085 / L-0084 inline clarification). Only api → user carries the URL."
  - "The upload is labelled POST, the GitHub flow (L-0082); the prose says a presigned PUT works too (fact-check inline)."
  - "`valid 60 s` is one of the class's examples (10, 20, 30, 60 s, L-0084). `s3://images/<id>.png` is the class's path shape (L-0081: s3://images/random_id.png)."
  - "`GET /feed` is an illustrative stand-in for 'other API calls' (L-0072). The bandwidth bar has no unit; its steps (one per crossing of the card) are illustrative, not measured."
  - "The memory half of L-0072 is left to the prose; the clip shows the network card only."
  - "The expiry is not exercised here (that is clip l09-signed-url-expiry). One user glyph stands for many users' uploads."
  - "The class's API server and the dedicated image upload service are one box `api` here (L-0077: the bytes skip both)."
additions: []
