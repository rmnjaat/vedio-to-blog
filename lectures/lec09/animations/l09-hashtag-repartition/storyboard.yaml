# Storyboard — clip l09-hashtag-repartition   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l09-hashtag-repartition
title: Re-keyed by hashtag
lecture: 7
section: "8.3 The adapter: re-partition by hashtag"
status: reviewed
why_motion: >
  Redistribution. The same post events first sit scattered by user (three #sunset posts on three partitions, so three
  counting servers each write one count++); then an extractor turns each post into one message per hashtag and the
  messages are re-keyed, so every #sunset converges on one partition and one server writes count += 3. Watching the
  three #sunset messages travel from three places into one place is the lesson; two stills hide which message went where.
static_twin: "Fig 8·b (frame 0: user_id-keyed topic, three counting servers, hashtag db) and Fig 8·c (the poster: the adapter); board D-08 (b_022245.jpg), D-11 (b_023400.jpg)"
ledger:
  taught: [L-0242, L-0243, L-0244, L-0247, L-0249, L-0250, L-0251, L-0267, L-0269, L-0270]
  context_only: [L-0240, L-0254, L-0297]
fidelity_notes:
  - "Post 31 with #sunset #sun #nature is the class's example (L-0247; board 'p1: #sunset #sun #nature'). Posts p40 (#sunset) and p52 (#sunset #sun) are illustrative, so that #sunset arrives from three users."
  - "Three partitions per topic follow the class's example (L-0270: 'e.g. three partitions, three servers'). Which partition each hashtag hashes to (#sunset → 1st, #sun → 2nd, #nature → 3rd) is illustrative; `hash(tag)` names no partitioner. The clip never shows one partition per hashtag as a rule (L-0251): three partitions hold three tags here only because the example has three tags."
  - "Naive beat: each server holds exactly one #sunset post, so 'three single writes' is literally true even though a server may sum within its own batch (L-0243 inline clarification: per-server batching still helps; re-keying makes the aggregation complete). The clip does not claim batching is impossible without re-keying."
  - "One extractor per partition of the post topic (board D-11 '#consumers = #partitions'; L-0250 'multiple hashtag-extractor consumers')."
  - "Messages in the hashtag topic are drawn as a tag chip; the post id of each (hashtag, post) tuple (L-0269) is written beside the chip while it waits at the extractor and is left off once it lands, for space. The page's Fig 8·d shows the full tuple."
  - "The counting servers are the same three boxes before and after: first fed straight from the post topic, then from POST_HASHTAG. The direct feed is removed when the new feed is drawn in the same place; the three red count++ writes are replaced in place by the green += n writes. That a server keeps a hash map (L-0297) is left to §8.4 / Fig 8·d."
  - "Search and notifications appear only as a faint 'also: search, notifications' on the post topic (L-0254 context: why the post topic is not re-keyed)."
  - "Not in the clip: adding partitions later (A-HSD-03), over-counting on a crash (L-0255), Redis Pub/Sub (L-0245/L-0246), the word 'adapter' as the GoF pattern (L-0254 inline clarification: it is the class's label; frameworks call it re-keying)."
  - "No numbers other than the counts of the example (3, 2, 1). No timing on screen."
