# Storyboard — clip l06-badge (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l06-badge
title: Three people, not three hundred
lecture: 8
section: "5.1 What the 3 means"
status: reviewed  # draft | approved | built | reviewed
why_motion: >
  Accumulation plus a reset. Two numbers grow at different rates while B is offline: the unread messages climb with
  every message, the badge moves only when a new sender appears. Then one tap resets one of them and not the other.
  Two stills show "3" beside "300"; only motion shows which event moves which number, and that the tap acknowledges
  without reading.
static_twin: "Fig 5·a 'Three people, not three messages' (D-08, b_020345.jpg: paper-plane icon with a circled 3) and Fig 5·d 'One set per user' (D-09 left side, b_022348.jpg: 'user_id: unique_users set<>', 'delete set when user clicks [icon]')"
ledger:
  taught:
    - L-0231  # twist: badge = number of unique people with new messages; 300 messages from 3 people shows 3
    - L-0256  # whenever a user messages this user, the sender is put into the recipient's set
    - L-0227  # clicking the icon drops the count to zero; it does not mean the messages were read
    - L-0257  # when the user clicks the icon, the set is deleted (no O(1) claim: fact-check A-PTU-13)
    - L-0233  # "newly" means since the last click on the message icon
  context_only:
    - L-0224  # scenario: offline, messages arrive, you see a counter (B0 "B · offline")
    - L-0226  # newly unread, not unread (prose + PauseAndThink)
    - L-0230  # requirement wording: presence of new messages (prose)
    - L-0254  # keep only the set, show its length on the badge ("badge = unique senders" header + dashed link)
    - L-0255  # set size is tracked by the set (prose, A-PTU-11)
fidelity_notes:
  - "The badge counting unique senders is the class's deliberate twist (a 'pseudo constraint', L-0231), labelled on screen as 'this design: badge = unique senders'. The clip claims nothing about how Instagram or any real app counts (L-0226, L-0228 are unverifiable)."
  - "300 messages from three people is the teacher's own example (L-0231, 02:06:30). The split between A, C and D, and the four messages of beat 1, are illustrative; the counter runs linearly 5 -> 300 during the sped-up stretch, labelled 'sped up'."
  - "The set is drawn generically as mono 'B: { A, C, D }' (the board's 'user_id: unique_users set<>'). Redis, SADD and DEL are not named: Redis comes in §5.5 and the commands in Fig 5·e."
  - "Deleting the set carries no complexity claim. The class said O(1); the fact-check (L-0257, imprecise/low, A-PTU-13) says DEL is O(number of members), cheap for small sets. The clip says only 'set deleted on tap'."
  - "When the set is empty (frame 0 and after the tap) the badge is drawn as a dashed grey circle with 0 (Fig 5·d: 'badge gone'); the clip does not claim whether a real app hides it or shows 0."
  - "The unread counter is the inbox's own count (messages B has not opened), shown grey inside the phone; the clip does not say how it is stored. It goes 300 -> 301 when D's message arrives after the tap: nothing was read, so it never drops (L-0227 'the unread messages are still there')."
  - "How the sender reaches the set (messaging service, ON_MSG_UNSENT, workers) is §5.6 and §6. Here a message's arrival and the set update are one event."
  - "'B · offline' is the lecture's scenario (L-0224); the tap is B opening the app and tapping the messages icon. Reading a conversation is never shown."
