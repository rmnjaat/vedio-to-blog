# Storyboard — clip l06-hash-scan (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l06-hash-scan
title: Rows touched per query
lecture: 8
section: "2.3 The query that reads every row"
status: reviewed  # draft | approved | built | reviewed
why_motion: >
  Accumulation. The lesson is that the cost of `WHERE HASH(email) = ?` grows with every row of the table and again
  with every request, while the indexed lookup stays at one row. Two stills show "many rows" against "one row";
  only the counter climbing row by row (and climbing again on each new request, while the other side ticks by one)
  shows why the "derivable, so don't store it" design falls over.
static_twin: "Fig 2·b 'Two WHERE clauses' (panel a: users table, every row hashed, red bracket; panel b: index tree, one row, green tick); board D-02 (b_013230.jpg) for the query text"
ledger:
  taught:
    - L-0080  # the database must read every row, hash each email and compare: a whole-table scan
    - L-0081  # a computation in the WHERE clause can't use the index -> full table scan every single time
    - L-0082  # not always true that derivable values shouldn't be stored: if it slows things down, store it
    - L-0083  # store a hash column, index it, WHERE users.hash = ? -> very pointy, one row
  context_only:
    - L-0074  # the request carries the hash, not the user id (B0 caption)
    - L-0077  # WHERE HASH(email) = ? works functionally (prose + CodeBlock)
    - L-0079  # extra hash computation per query (prose)
    - L-0084  # email and hash both unique, indexed keys (prose)
fidelity_notes:
  - "10,000 rows is the teacher's own example ('Let's say I have 10,000 rows', 00:39:45). 20,000 and 30,000 are only 10,000 x the number of requests shown; no rate (queries per second) is claimed, so the plan's 'ten a second' was dropped: the lecture gives no rate."
  - "The match is drawn at row 3 of the 5 visible rows; its position is illustrative. The cursor does not stop at the match: with only HASH(email) to go on, the database can't know where (or whether another) match is without hashing every row, which is what L-0081 says ('unless it goes through every single email')."
  - "Emails are placeholders (a@…, b@…); no real addresses. The board's sample hash 0eafd172 is not shown: the query keeps the board's '?'."
  - "The query text follows the board: 'where HASH(email) = ?' and 'where users.hash = ?' (shortened on screen to 'WHERE hash = ?'). HASH() is the board's name; MD5 (named elsewhere in class) is not drawn."
  - "The index is drawn as a small three-level tree (B-tree outline) on hash; the lecture says 'index it', 'very pointy', 'almost order one'. The clip says 'one lookup' and shows one row read; it does not claim O(1) (fact-check: an indexed B-tree lookup is O(log n))."
  - "Not claimed: that an index can never help a computed predicate. The expression-index exception (SN-03, A-GD-04/05) stays in prose right after the clip. The clip shows the class's schema: a plain index on email, no expression index."
  - "The join with photos (L-0080 'before it can do the join') is left to prose and the CodeBlock: the clip counts only rows of users read to find the user."
  - "Re-sweeps in B3 are drawn faster than B1 (sped up); durations carry no meaning, only the counts do."
