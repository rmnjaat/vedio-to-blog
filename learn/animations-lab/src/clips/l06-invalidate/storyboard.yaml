# Storyboard — clip l06-invalidate (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l06-invalidate
title: The old face lingers
lecture: 8
section: "3.3 When the photo changes"
status: reviewed  # draft | approved | built | reviewed
why_motion: >
  A window in time. What matters is how long a wrong answer keeps being served after the photo changes, and what
  closes that window. In a still, "TTL 1–2 days" and "purge /h1" are two labels; in motion the reader watches the old
  photo come back request after request while the clock runs to the TTL, then sees the same requests answered with
  the new photo once a purge closes the window almost at once.
static_twin: "Fig 3·b panel b (invalidation) and board D-05 (b_011130.jpg / b_011345.jpg); frame 0 = that diagram plus an empty two-lane time track"
ledger:
  taught:
    - L-0126  # the event exists to invalidate the CDN: once user 2 loaded user 1's photo, the CDN serves it to everyone; a change must evict it
    - L-0127  # photos rarely change, so the TTL might be one or two days
    - L-0128  # even with a long TTL, invalidate right away when the user changes the photo (good UX)
    - L-0129  # photo-updated event -> consumers (workers) call the CDN API to invalidate /h1; next request misses, API reads DB + S3, CDN caches and serves
  context_only:
    - L-0124  # hit/miss flow (B1 hits and B5's miss show it; taught in 3.2)
    - L-0125  # API updates the DB and pushes an event to Kafka (drawn in B2/B4; prose teaches it)
    - L-0130  # every CDN exposes invalidation APIs (prose)
fidelity_notes:
  - "'user 1' (the uploader) and 'user 2' (the visitor) are the teacher's own names (01:11:52). The visitor stands for every visitor (L-0126: 'served via CDN to all the users')."
  - "v1 / v2 are labels for the old and new photo; the lecture names no versions. The db shows which photo is active (v1 -> v2); S3 keeps both files (the upload adds v2)."
  - "TTL is shown as 'TTL: 1–2 days', the lecture's hedged guess (L-0127: 'might have a TTL of one day or two day'); fact-check: accurate, not a claim about Gravatar's real headers. The track is labelled 'time (not to scale)': the TTL span and the purge delay are not drawn to scale, and no seconds/hours are claimed for the purge."
  - "'purge /h1' is the board's 'invalidate a path /h1' (L-0129) in the word Fig 3·b and the page caption use; the board labels the bus 'queue' and the audio says Kafka (L-0129 detail) — the clip says kafka."
  - "Lane A (TTL only) is a projection drawn on the track only: the diagram does not replay the TTL-expiry refill, so the diagram stays at 'just after the change' until B4. The ✓ after the TTL mark on lane A is the refill the lecture describes for any miss (L-0124)."
  - "On a miss the clip shows cdn -> api and the new photo coming back; the api's db + s3 reads (L-0129) were drawn in B2 and are not re-animated (one motion per beat)."
  - "The direct-call variant (the API calls the CDN synchronously, accepted in class, L-0128 detail) and the browser-cache caveat (A-GD-13) are left to prose after the clip."
  - "Not claimed: how fast the purge takes effect, how many requests arrive, that edges everywhere drop the file at the same instant, or Gravatar's real TTL."
