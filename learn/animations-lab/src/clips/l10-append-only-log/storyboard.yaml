# Storyboard — clip l10-append-only-log   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l10-append-only-log
title: One file, one map
lecture: 10
section: "7.4 Get: an in-memory map to the latest offset"
status: reviewed
why_motion: >
  Ordering / position over time. The lesson is an order of events and a position that only moves one way: every
  put, update and delete is appended at the tail FIRST, and only THEN is the key pointed at the new offset; the write
  position never moves back, so K1's pointer jumps from O1 to O4 while the old entry stays on disk, and K2 simply
  leaves the map. Fig 7·b shows only where things end up.
static_twin: "Fig 7·b (D-14 redraw, b_021445.jpg): operations list left, in-mem map middle, append-only file right. Frame 0 = the same layout before any write (empty file with its write slot, empty map)."
ledger:
  taught: [L-0211, L-0213, L-0216, L-0217, L-0221, L-0222, L-0223, L-0224, L-0226]
  context_only: [L-0210, L-0225]
fidelity_notes:
  - "Layout follows the board (D-14) and Fig 7·b: ops list | in-mem map | file, pointer arrows map → file. animations.md sketched the map right of the file; the board/static-twin order wins so frame 0 matches the page figure."
  - "The disk head is not drawn. 'Zero seek' holds only while the disk serves just this write stream, and gets do seek (factcheck_applied L-0210). The clip shows only the write slot at the tail (L-0216: writes only at the end) and claims no seek behaviour."
  - "−1 is the class's marker value (L-0217, board 'DEL K2 = PUT(K2, -1)'); the clip does not claim how real Bitcask marks deletes."
  - "Offsets O1…O5 are the board's names for 'the offset of this entry' (L-0222); no byte values are shown. Rows are not to scale."
  - "O(1) on the poster is L-0226's claim for get, put and delete (update is a put, L-0213). The get beat still shows its one disk read (L-0224)."
  - "Obsolete rows (K1 V1 after the update, K2 V2 after the delete) stay on disk, ghosted; nothing is erased from the file. K2 −1 stays at full ink: it is the latest entry for K2 even though the map no longer points at it. Garbage collection (§8) is not shown."
  - "The GET K2 → 404 outcome reads 'no entry in the map, so no disk read' (L-0224, L-0223). 404 is the class's 'return 404 or something'."
  - "Not claimed: crash rebuild (L-0225, the step-through Fig 7·c after the clip), memory limits (L-0228), file growth (L-0229)."
