# Storyboard — clip l03-odd-even (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l03-odd-even
title: One ticket server goes away and comes back
lecture: 3          # folder lec03, course position 06 ("Lecture 06")
section: "5.8 When the odd server comes back"
status: reviewed    # draft | approved | built | reviewed (render-check rounds: lectures/lec03/animations/l03-odd-even/review.md)
why_motion: >
  A repeated protocol plus a window: round robin alternates two ticket servers, then one is absent for a while
  and the other runs far ahead. The "aesthetic" problem only appears once the stream interleaves again after the
  return (7, 204, 9, 206). A still shows one moment; the clip shows the IDs staying unique the whole time while
  their order gets worse, and the optional reset that only tidies the order.
static_twin: "Fig 5·d (board D-16, b_013130.jpg; Q&A state b_013500.jpg): two ticket cylinders, an lb bar under them, requests coming up from below"
ledger:
  taught:
    - L-0177  # one ticket server odd, the other even (status line 'odd' / 'even'; counters step by 2)
    - L-0179  # round robin alternates, IDs come out 1, 2, 3, 4 ... almost in order (row 1)
    - L-0180  # one goes down, the other carries on (row 2)
    - L-0181  # odd dies after 5, even reaches 202, odd resumes 7, 204, 9, 206; still unique, only looks odd (row 3)
    - L-0182  # optional: reset both to max + buffer, 241 and 242; round robin continues 241, 242, 243, 244 (row 4)
    - L-0183  # the reset is only for looks; order was never promised (final caption)
  context_only:
    - L-0178  # auto_increment_increment / offset settings (Fig 5·d and prose; not in the clip)
    - L-0187  # "where did we enforce monotonicity?" (prose after the clip)
fidelity_notes:
  - "5, 202, 7 / 204 / 9 / 206 and 241 / 242 are the class's numbers (L-0181, L-0182). The board also shows 240/241 and 239/240 (D-16, Q&A); one consistent example is used, as on the page (§5.8)."
  - "The counter inside each cylinder is the server's NEXT ID (labelled 'next'), so the dead odd server visibly keeps 'next 7' while it is down: MySQL persists the counter (L-0181 'MySQL is a persistent source'). The persistence mechanism (InnoDB redo log, A-IG-14) and its crash caveat stay in prose."
  - "The reset is shown after the interleaved row, as the optional alternative the lecture offers. In class the max was 202 at the moment the odd server returned; here the even server has reached 206 by then, so the clip says only 'max + buffer' (no number) and lands on the class's 241 / 242, which is above either max."
  - "The reset is shown as the two counters changing value; who does it (an SRE or a script, L-0185) and the fact-check note that the variables are dynamic and need no reboot are prose (SN-11 margin). No process reboot is drawn, and 'restart' is not used in the caption."
  - "The clip makes no claim that the servers coordinate or gossip (SN-11: Flickr's servers never coordinate; A-IG-10: Flickr lets the sides drift). The class's 'id = id + 1' query does not appear (SN-10)."
  - "Each request is one blue packet that rides the entry arrow into the lb bar and up the link to the chosen server; the ID it gets is written into the strip at the same moment (blue, settling to ink). The response packet back to the client is omitted to keep one motion per request (simplification)."
  - "Row 2 is fast-forwarded: three requests at normal pace (8, 10, 12), then the even counter rolls up to 204 while the row writes '… 202'. Labelled on screen 'sped up'. No request rate or duration is claimed."
  - "7 and 9 are ringed in graphite, not red: nothing is wrong. Green ✓ 'unique' marks row 3 (L-0181 'you are still getting unique ID')."
  - "Not claimed: strict order after the reset (L-0183), any timing, which server the lb picks first beyond alternation, Flickr resetting anything (it does not; prose)."
