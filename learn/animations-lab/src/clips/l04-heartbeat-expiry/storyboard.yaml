# Storyboard — clip l04-heartbeat-expiry (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l04-heartbeat-expiry
title: Every beat moves the deadline
lecture: 1   # course position 01 (folder lec04)
section: "2.8 Let the database expire it"
status: reviewed     # draft | approved | built | reviewed
why_motion: >
  A window in time. The key's expiry is pushed forward on every heartbeat, and "offline" is the moment the
  window finally closes, 30 s after the last beat, with nobody calling anything. A still shows a key with a
  TTL; only motion shows the deadline moving forward on each beat, the countdown running on its own after the
  battery dies, and (lane 2) a plain SET clearing the TTL so the deadline never comes.
static_twin: "Fig 2·i panel b (api -> store with a TTL timer, SET u42 EX 30, the store's own dashed expiry) + the laptop and friend's screen of Fig 2·e; board b_004430.jpg ('Every heartbeat move the expiration time forward !')"
ledger:
  taught:
    - L-0046  # a client cannot announce going offline: battery dies -> no offline call, UI keeps showing online
    - L-0047  # no heartbeat for long enough -> offline
    - L-0048  # 'long enough' is business logic; this design uses 30 s
    - L-0062  # absence = offline: each heartbeat resets the 30 s timer, when it runs out the entry is deleted
    - L-0068  # offload expiry to the database (don't reinvent the wheel)
    - L-0070  # final logic: every heartbeat sets the entry with TTL 30 s; the store deletes it; exists = online; board 'every heartbeat move the expiration time forward'
  context_only:
    - L-0069  # key-value + expiration: Redis and DynamoDB
    - L-0103  # heartbeats every 10 s (the class's interval, taught in 4.1)
    - L-0327  # the TTL is there because space mattered
fidelity_notes:
  - "10 s (heartbeat interval, L-0103) and 30 s (threshold, L-0048) are the class's numbers. Beats at 0, 10 and 20 s, the battery dying at 22 s and the expiry at 50 s are an example timeline; the captions say '30 s after the last heartbeat', never '30 s after the battery died'."
  - "The store is drawn as Redis (mono 'redis', command SET u42 1 EX 30). The class said 'Redis or DynamoDB, whichever you choose'. DynamoDB's late deletion (SN-02 / A-OOI-02: 'typically within a few days', so check expires_at) is NOT animated; it stays in the page's SourceNote. The clip never says 'DynamoDB'."
  - "Lane 2 (plain SET without EX clears the TTL, the key never expires) is the fact-check's addition A-OOI-01 (SN-02), not something said in class. It is labelled 'no EX' on screen and listed under additions."
  - "Time is sped up (labelled 'sped up' on the track). The clock pauses while a heartbeat travels laptop -> api -> redis, so the hops are not to scale."
  - "The friend's screen shows the dot only; how it reads the key (GET /status, EXISTS) is left to prose. The api box is the class's 'REST endpoints talking to this database' (L-0070)."
  - "The store's expiry is drawn as graphite (dashed key outline + graphite ✕): deleting is the mechanism working, not a failure. Red is used only for the dead battery and the missing EX."
  - "Not claimed: how Redis expires keys inside (lazy + sampling; ForwardChip), any millisecond precision, that the offline call is never useful, any number of users."
additions:
  - {fact: "In Redis a plain SET clears a key's TTL; write SET key value EX 30 on every heartbeat or the key never expires (TTL returns -1).", id: A-OOI-01, source_url: "https://redis.io/docs/latest/commands/expire/", checked: 2026-10-13}
canvas: {width: 1200, height: 800, fps: 30}
phone_canvas: {width: 720, height: 1000, note: "used at <= 640 px; laptop -> api -> redis on row 1, friend's screen on row 2 under redis with 'friend sees' to its left, 'battery dies' under the laptop; lane 1 and lane 2 stacked full width; lane titles above each track; 'sped up' on its own line between lane 1's tick labels and lane 2's title (critic C-08); 'online' for lane 2 under its end dot; lettering 30 px, captions 32 px"}
chapters_note: "chapter marks sit 10 frames into each beat so a seek lands on a settled frame with its caption up"
