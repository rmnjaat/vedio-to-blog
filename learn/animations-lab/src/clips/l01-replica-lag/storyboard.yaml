# Storyboard — clip l01-replica-lag (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l01-replica-lag
title: Replication lag
lecture: 1
section: "2.4 Scaling the database"
status: reviewed     # draft | approved | built | reviewed
why_motion: >
  The lesson is a window in time: a row exists on the master but not yet on the replica, and a read
  that lands inside that window is wrong. A static figure can show the states; only motion shows the
  window opening, a read falling into it, and the window closing on its own while nothing else changes.
  The time track accumulates the lag as a growing red span (accumulation = motion's job).
static_twin: "fig-lag (step-through swim lanes, same 5 numbered steps) and board D-06(b)"
ledger:
  taught:
    - L-0107  # master + replica, asynchronous replication
    - L-0109  # the replica calls the master and pulls; the master does not push
    - L-0110  # writes go to master, reads to replica; the app does the routing
    - L-0113  # replication lag makes a read miss a just-made write (banking example → story 42)
  context_only:
    - L-0104  # reads dominate (why reads go to replicas) — prose, not in clip
fidelity_notes:
  - "The lecture never gives a lag duration. The clip shows no number and labels the axis 'time (slowed down)'."
  - "'changes since 41?' is our wording for 'the replica calls the master and pulls the changes' (L-0109)."
  - "Medium case: story 42 stands in for the lecture's banking example (same mechanism, L-0113)."
canvas: {width: 1200, height: 800, fps: 30}
duration_frames: 900   # 30.0 s; 60 s at 0.5×
start_frame_equals: "static architecture: api → master / api → replica, dashed replica→master pull link, both hold story 41"
poster_frame: 899
reduced_motion_stills: [80, 262, 440, 650, 800, 899]
glyphs:
  api: {shape: server-box, label: "api", pos: [500, 40, 200, 84]}
  master: {shape: cylinder-solid, cx: 255, rows: ["story 41"]}
  replica: {shape: cylinder-dashed, cx: 945, rows: ["story 41"]}
  write_arrow: {route: "api left → master top", solid: true, head: master}
  read_arrow: {route: "api right → replica top", solid: true, head: replica}
  pull_arrow: {route: "replica → master", dashed: true, head: master, note: "replica initiates"}
  time_track: {axis_y: 568, x: [150, 1040], maps_frames: [90, 800], label: "time (slowed down)"}
