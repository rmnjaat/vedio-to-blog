# Storyboard — clip l07-lru-vs-lfu (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l07-lru-vs-lfu
title: A scan and a spike
lecture: 9            # course position; folder id lec07
section: "3.4 LRU or LFU? Follow the key's life"
status: reviewed      # draft | approved | built | reviewed
why_motion: >
  Accumulation, then a flush. Read counts build up over a day of traffic while LRU's recency order keeps
  shuffling; then one burst of one-off reads arrives, and LRU pushes the evergreen pages out one by one while LFU
  only ever drops the one-off pages. The cost shows up afterwards: the morning reads miss in LRU and hit in LFU.
  Two stills (before and after) show different contents but not that one cold burst did it, or that the misses
  come later.
static_twin: "Fig 3·c (D-08 redraw: the two access patterns, LFU · wikipedia with a world-cup spike). Frame 0 is the clip's own figure: the two empty six-slot caches that the page prose and P5 describe."
ledger:
  taught:
    - L-0165  # one scan wipes out recency-based entries; frequency keeps the heavily used items -> B2, the scan evicts A-D from LRU, only S-pages from LFU
    - L-0167  # LFU: keep a key even though its access recently dipped; past frequency predicts future -> A-D sit untouched through the scan but keep their counts; B4 caption
    - L-0168  # Wikipedia: a page quiet now but frequently read before should stay -> "evergreen pages" A-D, read all day
    - L-0169  # a recent spike should not evict the top pages: once the fad goes they are read with the same frequency again -> B3 morning reads of A-D
  context_only:
    - L-0162  # the question "when LRU, when LFU" (page prose before the clip)
    - L-0170  # where LRU fits (hit hard, then forgotten): the prose right after the clip (news case); not shown here
    - L-0172  # Google News, the LRU case (prose after the clip)
    - L-0174  # RuleBox §3: understand the key's life cycle, then decide
fidelity_notes:
  - "The burst is the class's scan answer (L-0165): a nightly scan reads six articles once each. The instructor's World Cup spike (L-0169) is carried by its second half, the part the clip shows: once the burst passes, the top pages are read again. A spike that reads one page many times is not simulated (under exact LFU it would build its own count); the clip does not claim anything about it."
  - "Exact LRU (a list, newest at the left) and exact LFU (a count per key; ties broken by evicting the least recently used of the tied keys) are shown for clarity. Redis approximates both by sampling (SN-06, A-DCL-02); the page caption under the clip says so. Counts are not decayed (Redis's LFU decays them); not claimed."
  - "Cache size 6, four evergreen pages A-D, ten daytime reads (A B C D A B C D A B), six scan reads S1-S6, four morning reads A B C D. All illustrative; the class gave no sizes or counts. The tallies (4 misses vs 4 hits) are the clip's own simulation (sim.ts), not lecture numbers."
  - "The 'the scan evicted' rows record the scan's evictions only. In the morning LRU evicts S1-S4 again to make room for A-D; those cards turn red and fade off the oldest end without being added to the row (the row would otherwise mix two stories)."
  - "Time is compressed (a day, a night, a morning in 35 s); no clock is shown and no durations are claimed."
  - "Not claimed: that LFU is better in general (the prose follows with the news case, where LRU wins, L-0170/L-0172), that LRU cannot be made scan-resistant (A-DCL-21, InnoDB midpoint insertion, is in the prose), any hit rate or latency."
