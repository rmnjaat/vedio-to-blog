# Storyboard — clip l04-cache-aside (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l04-cache-aside
title: One join, many hits
lecture: 1          # course position 01 (folder lec04)
section: "6.2 One shared cache for the blog"
status: reviewed    # draft | approved | built | reviewed
why_motion: >
  Accumulation / rate. The lesson is how often the expensive work happens: without a cache the database runs the
  same join on every read, with one shared cache it runs it once and every later read, whichever API server it
  lands on, is answered from the cache. A still shows the boxes (Fig 6·b); only the reads piling up while the
  join counter climbs in one phase and stays at 1 in the other shows the database's work flattening.
static_twin: "Fig 6·b (D-15 redraw: users → lb → three api → db, one shared cache) before the cache is drawn in; board b_021330.jpg / b_021645.jpg"
ledger:
  taught:
    - L-0248  # remote cache any API server can talk to; logically between the API servers and the database
    - L-0249  # read flow: check the cache; hit → return; miss → read the db, put it in the cache, return
    - L-0250  # no matter which API server a request goes to, all read the same cache: one copy, everyone reads it
    - L-0251  # popular blog: the 3–4 table join again and again is unnecessary db load; cache it centrally
    - L-0252  # the cache still costs a network IO, but reading the precomputed result beats recomputing
  context_only:
    - L-0244  # a cache saves expensive disk IO, network IO or computation (final caption's wording "expensive computation")
fidelity_notes:
  - "'3–4 table join' is the class's description (L-0251). No latencies, no load percentages: the only numbers on screen are counts of the reads and joins the clip itself plays (3 reads without a cache, 4 with one); they are illustrative, not the class's numbers."
  - "No load gauge: the database's work is shown as the join counter (L-0251 'again and again puts unnecessary load'); 'massive margin' is not quantified."
  - "The lb spreads reads straight across (user k → api k) to keep the paths readable; which server a read lands on is the point (L-0250), not the balancing algorithm."
  - "The cache is drawn as the kit's cube (Fig 6·b), reached over one shared line from the API servers' bus, the same bus that leads to the db: both are separate network destinations, and the API server talks to each itself (cache-aside, L-0249). The cache never fetches from the db (no read-through is shown)."
  - "Wide layout puts the cache above the db trunk (top right, as on the board); the phone layout puts it left of the db under the bus. Both read 'between the API servers and the database' logically (L-0248)."
  - "'blog' in the cache is the precomputed result of the join (L-0252 'pre-computed')."
  - "Not claimed: invalidation, TTL or freshness (the shared copy can go stale until invalidated or expired: fact-check note on L-0250; covered in Lectures 2 and 9). The green '✓ once' label holds for this clip's reads, not 'forever'. No product (Redis) is named."
