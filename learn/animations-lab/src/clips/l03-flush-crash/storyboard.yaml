page_context:
  predict: "The disk says 6. Watch where the counter really was when the machine died."
  caption: "Restart from 6 and 7, 8 go out twice; restart from 6 + 3 + 1 = 10 and nothing repeats."
  after: "Two habits from this: don't do IO on every call, and always restart from the safest value."
