# Storyboard — clip l03-flush-crash (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l03-flush-crash
title: The counter runs ahead of the disk
lecture: 3          # folder lec03, course position 06 ("Lecture 06")
section: "2.6 Flush every N, restart from the safest value"
status: reviewed    # draft | approved | built | reviewed
why_motion: >
  A window in time: between flushes the counter in memory runs ahead of the copy on disk, and the gap opens with
  every ID and closes with every flush. A crash that lands inside the window loses the difference. A still shows
  one moment; the clip shows the gap opening and closing, the crash landing inside it, the duplicates a
  naive restart makes, and the safe restart that jumps past the whole window.
static_twin: "none on the page (the former StepThrough was removed by the design fix, C-04); the clip-as-text covers no-motion readers. Source: board D-05, b_002445.jpg: a lane of issued IDs, time running down, and the disk value 03 → 06"
ledger:
  taught:
    - L-0042  # flush frequency: write the counter only every N IDs (title 'flush every 3 IDs', one solid flush arrow)
    - L-0043  # counter++ and save when counter % N == 0 (flushes land exactly at 03 and 06; code form stays in the CodeBlock)
    - L-0044  # worked example N = 3: 01-03 (3 flushed), 04-06 (6 flushed), 07, 08, crash; restart from 6 reissues 7 and 8
    - L-0045  # safest value = last flushed + N + 1 = 06 + 3 + 1 = 10 -> m1-10
    - L-0046  # some integers are never used, and that is fine: correctness over using every integer
  context_only:
    - L-0047  # takeaway 1: periodic IO via a mod, not a timer thread (prose after the clip)
    - L-0048  # takeaway 2: on recovery start from the safest value (prose after the clip)
fidelity_notes:
  - "N = 3, flushes at 03 and 06, crash after m1-08 with 06 on disk, restart m1-10 and the formula '06 + 3 + 1 = 10' are the class's numbers and the board's notation (D-05)."
  - "Unused numbers: the instructor said 'we never used 8 and 9 ... we lost those two values' (00:24:05), but m1-08 was handed out before the crash (L-0044 says so, and the clip shows it). So the clip marks only m1-09 as 'never used' and states no count. The final caption 'An unused number is fine. A duplicate ID is not.' keeps L-0046's point without repeating the slip."
  - "The memory box and the disk cylinder showing the live counter value are a visual addition to board D-05's lanes (the board has the lane and an 'On disk values' column 03 / 06). They state nothing beyond L-0044: memory holds the counter, the disk holds the last flushed value."
  - "The dashed box around the unflushed IDs and the bracket 'ahead of disk' are the window between flushes (L-0044: 'the last value that was written was 6, the ID generated was already 8'). Not to scale in time."
  - "The crash is drawn as a red line across the issued lane under m1-08 (the board strikes m1-08 with an arrow to CRASH) and the memory box re-inked red with its value gone. m1-08 itself is not struck: it was handed out and is in use, which is the point."
  - "Flushes are one solid write arrow memory → disk (the machine pushes a periodic write, so the head sits at the disk; the dashed glyph stays reserved for async copy, critic C-13), pen-drawn blue as data leaving and settling to graphite; the green ticks in the lane mark the IDs whose value reached the disk."
  - "On restart from 6 the memory box shows 06, then 07, 08 in red as they go out again. On the safe restart it shows 10 (green): board 'New starting value (safe) = m1-10'. The code form load() + N then ++ is not shown (CodeBlock in 2.6)."
  - "Not claimed: anything about fsync or page caches (A-IG-03, prose 2.4); that a crash can only happen at 8 (it is the class's example); how long a flush takes; a timer thread (L-0047, prose)."
