# Storyboard — clip l07-mod-vs-ring (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l07-mod-vs-ring
title: Add one node
lecture: 9            # course position; folder id lec07
section: "6.3 Adding and removing nodes"
status: reviewed      # draft | approved | built | reviewed
why_motion: >
  Redistribution. The lesson is how many keys move when one node appears: with hash % N every key is rechecked
  and half of them travel to another node; on the ring only the keys in the new node's slice change owner, and their
  data comes from one neighbour while everything else stays still. Before/after stills show positions, not the
  recheck of every key or the stillness of the rest.
static_twin: "Fig 6·a (D-17 redraw, the h % 2 → h % 3 tables) for the left panel; Fig 6·b / 6·d (D-18, D-19: the ring with c1 at 3, c3 at 5, c4 at 10, c2 at 12; c5 added at 1) for the right panel. Frame 0 = the left panel with c0/c1 and six keys (Fig 6·a table 1 as nodes); the right panel is empty until ③."
ledger:
  taught:
    - L-0272  # adding a node: mod 2 becomes mod 3, every key must be rechecked -> ① c2 penned, header digit rewritten, K1..K6 re-inked blue in turn
    - L-0273  # K1, K3, K4 stay; K2 c0->c2, K5 c1->c0, K6 c0->c2 -> ② the three slides
    - L-0274  # 3 of 6 = 50% data movement, the pain point -> tally "3 of 6 moved = 50%"
    - L-0291  # cache 5 hashes to 1; K1, owned by cache 1, is now owned by cache 5 -> ④ c5 at 1, K1's arrow re-pens to c5
    - L-0292  # only keys in the new node's range move (cache 1 -> cache 5), all other keys unaffected -> ④ bracket (12, 1], packets from c1, the other four arrows untouched
    - L-0294  # minimal data transfer when scaling -> right tally "2 of 6 moved" against "3 of 6"; summary caption
  context_only:
    - L-0271  # six keys on two caches, K1 K2 K6 / K3 K4 K5 (frame 0; taught in 6.1)
    - L-0284  # ring positions 3/5/10/12 (taught with Fig 6·b in 6.2)
    - L-0288  # owner = first node to the right (clockwise) (③ caption; taught in 6.2)
    - L-0289  # K1 at 0 -> cache 1 (③, the first arrow drawn)
    - L-0293  # "nodes before and after": fact-check simplified/low; the clip shows only the successor (c1) handing over, matching the applied wording
fidelity_notes:
  - "Left panel uses the board's exact mapping (D-17): h % 2 puts K1, K2, K6 on c0 and K3, K4, K5 on c1; h % 3 moves K2 and K6 to c2 and K5 to c0. Hash values (page-made, Fig 6·a) are not shown in the clip; the static figure carries them."
  - "Right panel uses the board's ring (D-18/D-19): 0..15, c1 at 3, c3 at 5, c4 at 10, c2 at 12, c5 added at 1, K1 at 0. Keys K2..K6 at 2, 4, 7, 11, 14 are page-made positions on the ring's own hash (L-0283's 0..15 range); they are not the left panel's hash values. Nodes are named c1..c5 (the board's 'cache 1'..'cache 5') to fit the ring."
  - "With this layout two of six ring keys fall in (12, 1] (K6 and K1), so the honest tally is 2 of 6 against 3 of 6. The two examples also differ in N (2 -> 3 on the left, 4 -> 5 on the right), as on the board; the summary line gives the averages so the comparison is not read off one lucky/unlucky layout."
  - "Data for the slice is shown travelling from c1 to c5 as two red packets (L-0292 'from cache 1 to cache 5'). How the copy is done (snapshot first, then add to the ring, L-0303) is §6.4's step-through, not this clip."
  - "Only the successor (c1) hands over keys; the predecessor (c2) is untouched. This matches the fact-check on L-0293 (simplified/low). Not claimed: replication, virtual nodes, removal."
  - "Red marks a moved key (the cost the lecture calls the pain point) in both panels; the second cue is the red '*' (the board's asterisk) and the dashed empty slot on the left, and the re-pointed arrow on the right."
additions:
  - fact: "Going from N to N+1 nodes, hash % N keeps a key on its node only when h mod N(N+1) < N, so about N/(N+1) of keys move on average (2/3 for 2 -> 3; the board's 50% is a lucky case). A ring moves only the new node's share, about 1/(N+1) of keys (n/m keys for n keys and m slots)."
    source_url: "https://en.wikipedia.org/wiki/Consistent_hashing"
    checked: 2026-10-14
    note: "Arithmetic derivation for % N; the ring average is the standard result on the cited page (the lecture fact-check's own source for L-0279/L-0293). Already a page addition in factcheck_applied.md §6 and figures.md Fig 6·a."
