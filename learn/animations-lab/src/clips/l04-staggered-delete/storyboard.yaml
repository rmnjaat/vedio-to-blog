# Storyboard — clip l04-staggered-delete (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l04-staggered-delete
title: One big delete vs many small ones
lecture: 1          # course position 01 (folder lec04)
section: "5.4 The soft-delete lifecycle"
status: reviewed    # draft | approved | built | reviewed (3 render-check rounds, 2026-10-13; see review.md). Revised 2026-10-14 for faithfulness F-002: requests slow down, none give up; no lock framing.
why_motion: >
  Impact over time. The same 100,000 soft-deleted rows are hard deleted twice: in one shot, and as
  10,000-row batches spread out. What differs is what happens to the traffic running alongside: while one huge
  delete runs, requests slow down and queue (none is lost, nothing goes down); between short batches they barely
  slow. A still can show the two schedules, but not the queue building behind the long delete and draining after it.
static_twin: "Fig 5·d (the life of a deleted blog: 'DELETE … LIMIT 1000' blocks spread along the axis, 'staggered, off-peak') and the batched-delete CodeBlock in 5.4"
ledger:
  taught:
    - L-0282  # 'a cron job has nothing to do with availability': no downtime (B2 'Nothing goes down', 'slowed, never down')
    - L-0263  # soft deletes grow the DB, so they are periodically hard deleted (a cron job picks them all up)
    - L-0283  # 100,000 rows under high traffic: not in one shot; staggered across the day like GC, 10,000 rows every hour
    - L-0295  # the hourly cron job also takes one or two pool connections: you gain some, you lose some
    - L-0297  # a retention policy in the DB is still someone deleting: the DB's thread does the cron job
    - L-0298  # regular deletes: offload to the database and do it in a staggered way (fact-check: 'always works' too strong; not said)
  context_only:
    - L-0284  # the interviewer's locking worry is about strong consistency, not availability (MarginNote in 5.4; not drawn: the clip shows no locks)
    - L-0230  # batching cuts lock, commit and log overhead (fact-check reading, 5.3)
fidelity_notes:
  - "100,000 rows and 10,000 rows an hour are the class's numbers (L-0283; he settled on '10,000 rows every hour' after shifting numbers; '1,000 at a time' is in the page prose, not on screen). Lane 2 runs ten batches of 10,000 so the counter steps 100,000 -> 0 exactly."
  - "What the clip draws is the class's point: one huge DELETE is the whole job at once, so its impact on the traffic is concentrated (L-0283: 'to minimize the impact'); staggered, the impact is spread thin. The strip is labelled 'deleting' (when a DELETE runs), not 'locks held': the class treated the locking worry as a consistency matter, not an availability one (L-0284), so the clip shows no lock gate and no lock model. No B+ tree rebalancing on screen (SN-07)."
  - "No request gives up and the service never goes down (L-0282: 'There would not be any downtime'; 'a cron job has nothing to do with availability'). Requests slow down and queue while the big DELETE runs, then drain; lane 1's verdict is 'slowed, never down', lane 2's 'barely slowed'. The slowdown is the illustrative form of 'the impact'; the lecture gives no latency figures."
  - "The number of requests, their rate, the per-request slowdown, the queue and the bar lengths are illustrative; the lecture gives none. The long bar is drawn 10x a short bar (same rows), not a claim that one big delete takes exactly as long as ten small ones. One shared 'time (not to scale)' label under the lower strip covers both strips (they share one x scale); lane 2's gaps between hourly batches are compressed."
  - "The poster caption says 'whether a cron job or the database runs it' (L-0297: the DB's retention thread is the cron job offloaded; L-0298: offload and stagger). It does not say 'always works' (fact-check on L-0298: simplified)."
  - "'1–2 connections' under lane 2's job is L-0295's 'one or two connections' from the pool. The trade-off (data grows if you don't delete) stays in prose."
additions: []   # the MySQL lock-duration addition was dropped with the lock framing (F-002)
