# Storyboard — clip l05-deadlock (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l05-deadlock
title: One cycle
lecture: 3          # course position "Lecture 03"; folder lec05
section: "1.5 Deadlocks"
status: reviewed    # draft | approved | built | reviewed (render-checked 2026-10-13, see review.md)
why_motion: >
  Contention and ordering. The lesson is the order of the waits: T1 waiting for row 1 is harmless on its own
  (waiting is not deadlock, L-0096); only the second wait, in the opposite order, closes the loop, and the engine
  breaks it at that moment. A still (Fig 1·e) shows only the finished loop; the clip shows the cycle being born
  from the lock order, which is why locking in one order (L-0028, A-C-04) prevents it.
static_twin: "Fig 1·e (D-01 redraw, frame b_001430.jpg, T2 restored): T1, T2 circles; row 1 top, row 2 bottom"
ledger:
  taught:
    - L-0025  # deadlock: the unannounced side effect of pessimistic locking (caption B0 framing, stamp)
    - L-0026  # T1 holds row 2 / wants row 1; T2 holds row 1 / wants row 2; nobody moves
    - L-0028  # arrange lock acquisition order (poster note "lock rows in one order", with A-C-04)
    - L-0031  # when a lock would make a transaction wait, the engine checks for a deadlock
    - L-0032  # a cycle in who-waits-for-whom = deadlock ("cycle" label, red loop)
    - L-0033  # the engine kills one transaction (softened per SN-04: "rolls one back")
    - L-0096  # waiting is not deadlock (B2 caption, graphite hourglass)
  context_only:
    - L-0027  # any pessimistic locking risks a deadlock (prose before the clip)
    - L-0030  # popular databases never let a deadlock persist (prose before the clip)
    - L-0035  # a stuck deadlock would need a reboot (prose)
fidelity_notes:
  - "Lock layout follows Fig 1·e / L-0026: T1 holds row 2, T2 holds row 1; T1 asks for row 1 first, T2 asks for row 2 second. The lecture names no order of the two requests; the clip picks T1 first so the harmless single wait can be shown (L-0096)."
  - "Victim (SN-04): the board says 'the transaction that detects the deadlock kills itself' (L-0033). The fact-check softened this: engines choose differently (InnoDB prefers the smaller transaction, PostgreSQL's choice is unpredictable, Oracle rolls back one statement). The clip says 'the engine rolls one back: here T2'. T2 happens to be both the one whose request closed the cycle (the teacher's rule) and a legitimate InnoDB victim (both transactions are the same size); the clip does not say why T2 was chosen."
  - "'ERROR 1213' is MySQL/InnoDB's deadlock error (A-C-02, sourced addition); PostgreSQL's is SQLSTATE 40P01 (left to SN-04)."
  - "'retry' under T2 follows A-C-02 / SN-04 (the application retries the whole transaction); the lecture's own fix is ordering (L-0028)."
  - "No detection delay is claimed: the stamp appears right after the cycle closes. PostgreSQL first waits deadlock_timeout (1 s, A-C-01); that stays in the prose (L-0031 inline)."
  - "Not claimed: 'kills itself' (only in the page's prose quote), how long T1 waited, any timing numbers, that the cycle ever persists (L-0030: engines never let it)."
  - "Ghosting: the 'cycle' label ghosts to 55% (its lines to 38%); at 38% the red word was illegible on the blackboard sheet."
  - "Routing is orthogonal (a rectangle loop) rather than the board's diagonals, so labels sit on straight runs and the loop reads as one ring."
additions:
  - {fact: "InnoDB rolls back the victim's whole transaction with ERROR 1213; the application should retry the entire transaction (A-C-02)", source_url: "https://dev.mysql.com/doc/refman/8.4/en/innodb-error-handling.html", checked: 2026-10-13}
  - {fact: "Acquiring locks on multiple rows in one consistent order prevents the cycle (A-C-04)", source_url: "https://www.postgresql.org/docs/current/explicit-locking.html", checked: 2026-10-13}
