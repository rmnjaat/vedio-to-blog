<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Call at Medium</title>
<meta name="description" content="Lecture 1, scaling the database, played as five on-call pages at Medium.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..850&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a fixed on-call desk. Top: pager strip with live metrics. Left: the live system (SVG + request dots). Right: the panel that holds the page, the moves, the outcome and the debrief stack. Phone: everything stacks; the system drawing switches to a portrait layout. */
:root {
  --paper: #f2eee4; --sheet: #fbf8f1; --ink: #1d1b16; --ink2: #5d574b; --rule: #d6cebd; --faint: #e7e0d1;
  --acc: #2a43c4; --acc-soft: #dde2f6; --bad: #c4321c; --bad-soft: #f5d8cf; --load: #cfc5b0;
  --strip: #1d1b16; --strip-ink: #f2eee4; --strip-ink2: #b4ac9b; --strip-bad: #ff8166; --strip-rule: #3b372e;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Martian Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #15140f; --sheet: #1e1c16; --ink: #ece5d5; --ink2: #a39b8a; --rule: #38342a; --faint: #28251d;
  --acc: #9cabff; --acc-soft: #262c4a; --bad: #ff7d63; --bad-soft: #45231b; --load: #4b4639;
  --strip: #0b0a07; --strip-ink: #ece5d5; --strip-ink2: #948c7b; --strip-bad: #ff8166; --strip-rule: #2c2920;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #15140f; --sheet: #1e1c16; --ink: #ece5d5; --ink2: #a39b8a; --rule: #38342a; --faint: #28251d;
  --acc: #9cabff; --acc-soft: #262c4a; --bad: #ff7d63; --bad-soft: #45231b; --load: #4b4639;
  --strip: #0b0a07; --strip-ink: #ece5d5; --strip-ink2: #948c7b; --strip-bad: #ff8166; --strip-rule: #2c2920;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.45; font-variation-settings: "wdth" 100; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 2px; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; border-radius: 3px; }
.mono { font-family: var(--f-mono); font-size: .82em; font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar */
.bar { display: flex; align-items: center; gap: 18px; padding: 0 20px; height: 54px; border-bottom: 1px solid var(--rule); background: var(--paper); }
.brand { font-weight: 800; font-stretch: 80%; font-variation-settings: "wdth" 80; font-size: 19px; letter-spacing: -.01em; white-space: nowrap; background: none; border: 0; padding: 4px 0; }
.brand span { color: var(--ink2); font-weight: 500; }
.rail { display: flex; gap: 2px; margin-left: 12px; flex: 1; min-width: 0; }
.rail button { border: 0; background: none; padding: 8px 10px 6px; font-size: 14px; color: var(--ink2); border-bottom: 3px solid transparent; white-space: nowrap; }
.rail button .mono { font-size: 11px; margin-right: 6px; }
.rail button.seen { color: var(--ink); }
.rail button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--acc); font-weight: 650; }
.tools { display: flex; gap: 8px; margin-left: auto; }
.tools button { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 11px; font-size: 14px; }

/* ---------- desk */
.desk { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(380px, 1fr); grid-template-rows: auto minmax(0, 1fr); height: calc(100vh - 54px); min-height: 640px; }
.pager { grid-column: 1 / -1; background: var(--strip); color: var(--strip-ink); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 28px; align-items: center; padding: 12px 20px; }
.pager .msg { display: flex; gap: 14px; align-items: baseline; min-width: 0; }
.pager .when { font-family: var(--f-mono); font-size: 13px; color: var(--strip-ink2); white-space: nowrap; }
.pager .what { font-size: 17px; font-weight: 600; font-variation-settings: "wdth" 88; }
.pager .eg { font-family: var(--f-mono); font-size: 11px; color: var(--strip-ink2); border: 1px solid var(--strip-rule); border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
.metrics { display: flex; gap: 0; }
.metric { padding: 0 16px; border-left: 1px solid var(--strip-rule); min-width: 118px; }
.metric dt { font-size: 12px; color: var(--strip-ink2); }
.metric dd { margin: 0; display: flex; align-items: center; gap: 8px; }
.metric .v { font-family: var(--f-mono); font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric.bad .v { color: var(--strip-bad); }
.metric svg { width: 48px; height: 18px; overflow: visible; }
.metric svg path { fill: none; stroke: var(--strip-ink2); stroke-width: 1.4; }
.metric.bad svg path { stroke: var(--strip-bad); }

.stage-wrap { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 14px 20px 12px; }
#stage { flex: 1; min-height: 0; width: 100%; height: 100%; }
#stage text { font-family: var(--f-ui); fill: var(--ink); }
#stage .lbl { font-size: 13px; fill: var(--ink2); }
#stage .cpu { font-family: var(--f-mono); font-size: 12px; font-weight: 500; }
#stage .wire { stroke: var(--rule); stroke-width: 1.6; fill: none; }
#stage .wire.hot { stroke: var(--ink2); }
#stage .repl { stroke: var(--ink2); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
#stage .repl.bad { stroke: var(--bad); }
#stage .box { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; }
#stage .box.hotbad { stroke: var(--bad); }
#stage .fill { fill: var(--load); }
#stage .fill.bad { fill: var(--bad-soft); }
#stage .fill.badline { stroke: var(--bad); }
#stage .ring { fill: none; stroke: var(--acc); stroke-width: 2; stroke-dasharray: 3 3; }
#stage .num circle { fill: var(--acc); }
#stage .num text { fill: var(--sheet); font-family: var(--f-mono); font-size: 12px; font-weight: 600; }
#stage .dot-r { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; }
#stage .dot-w { fill: var(--ink); }
#stage .dot-own { fill: var(--acc); stroke: var(--acc); }
#stage .x { stroke: var(--bad); stroke-width: 2.4; }
#stage .note { font-family: var(--f-mono); font-size: 12px; fill: var(--ink2); }
#stage .note.bad { fill: var(--bad); }
#stage .ladder rect { fill: var(--load); }
#stage .ladder rect.q { fill: none; stroke: var(--bad); stroke-dasharray: 3 3; }
.stage-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 13px; color: var(--ink2); padding-top: 6px; }
.stage-cap { flex-basis: 100%; min-height: 1.5em; font-size: 16px; color: var(--ink); font-weight: 550; display: flex; gap: 10px; align-items: baseline; }
.stage-cap .n { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--acc); color: var(--sheet); font-family: var(--f-mono); font-size: 12px; font-weight: 600; transform: translateY(-1px); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.legend svg { vertical-align: -3px; }
.legend .g-r { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; }
.legend .g-w { fill: var(--ink); }
.legend .g-x { stroke: var(--bad); stroke-width: 2.2; }
.legend .g-rep { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 3 2; }
.motion { margin-left: auto; background: none; border: 1px solid var(--rule); border-radius: 5px; padding: 3px 9px; font-size: 13px; color: var(--ink2); }
.toy-tag { font-family: var(--f-mono); font-size: 11px; color: var(--ink2); }

/* ---------- panel */
.panel { grid-column: 2; grid-row: 2; border-left: 1px solid var(--rule); background: var(--sheet); overflow-y: auto; min-height: 0; }
.panel-in { padding: 22px 26px 30px; }
.panel h1, .panel h2 { font-weight: 800; font-variation-settings: "wdth" 76; letter-spacing: -.012em; line-height: 1.02; margin: 0; text-wrap: balance; }
.panel h1 { font-size: 46px; }
.panel h2 { font-size: 34px; }
.panel h3 { font-size: 20px; font-weight: 750; font-variation-settings: "wdth" 86; line-height: 1.15; margin: 0; text-wrap: balance; }
.ask { font-size: 18px; font-weight: 600; margin: 14px 0 16px; max-width: 34ch; }
.lede { font-size: 17px; margin: 14px 0 0; max-width: 40ch; }
.lede + .lede { color: var(--ink2); font-size: 15px; margin-top: 8px; }
.moves { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.move { width: 100%; text-align: left; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 10px; align-items: start; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 8px; padding: 12px 14px; transition: transform .12s, box-shadow .12s; }
.move:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
.move .key { grid-row: span 2; font-family: var(--f-mono); font-size: 13px; border: 1.5px solid var(--ink); border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; margin-top: 1px; }
.move b { font-size: 17px; font-weight: 700; }
.move small { font-size: 14px; color: var(--ink2); }
.move.tried { border-style: dashed; }
.move.tried small::after { content: " · tried"; font-family: var(--f-mono); font-size: 11px; }
.primary, .secondary { border-radius: 7px; padding: 10px 16px; font-size: 15px; font-weight: 650; }
.primary { background: var(--ink); color: var(--paper); border: 1.5px solid var(--ink); }
.secondary { background: none; border: 1.5px solid var(--ink); }
.linkish { background: none; border: 0; padding: 6px 0; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; color: var(--ink2); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.chose { font-size: 14px; color: var(--ink2); margin: 0 0 10px; }
.chose b { color: var(--ink); }
.beats { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.beats li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: 16px; opacity: .28; transition: opacity .3s; }
.beats li.on { opacity: 1; }
.beats li.past { opacity: .62; }
.beats .n { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--acc); color: var(--acc); font-family: var(--f-mono); font-size: 12px; font-weight: 600; margin-top: 1px; }
.beats li.on .n { background: var(--acc); color: var(--sheet); }
.verdict { margin-top: 20px; padding-top: 14px; border-top: 2px solid var(--ink); }
.verdict .tag { font-family: var(--f-mono); font-size: 12px; color: var(--ink2); display: block; margin-bottom: 4px; }
.verdict p { margin: 6px 0 0; font-size: 15px; color: var(--ink2); max-width: 44ch; }

/* debrief card stack */
.deb-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.deb-head .mono { color: var(--ink2); }
.stack { position: relative; margin-top: 14px; }
.stack::before, .stack::after { content: ""; position: absolute; left: 8px; right: -8px; top: 8px; bottom: -8px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--paper); z-index: 0; }
.stack::after { left: 4px; right: -4px; top: 4px; bottom: -4px; }
.stack.last::before { display: none; }
.stack.last::after { display: none; }
.card { position: relative; z-index: 1; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 10px; padding: 18px 18px 16px; }
.card h3 { font-size: 22px; }
.card p { margin: 10px 0 0; font-size: 15.5px; max-width: 52ch; }
.card .fig { margin: 12px 0 2px; }
.card .fig svg { width: 100%; height: auto; display: block; max-height: 190px; }
.card .fig text { font-family: var(--f-ui); font-size: 13px; fill: var(--ink); }
.card .fig .s { fill: var(--ink2); }
.card .fig .m { font-family: var(--f-mono); font-size: 12px; }
.card .fig .ln { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.card .fig .ln2 { stroke: var(--ink2); stroke-width: 1.3; fill: none; }
.card .fig .dash { stroke: var(--ink2); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
.card .fig .acc { stroke: var(--acc); fill: none; stroke-width: 2; }
.card .fig .accf { fill: var(--acc); }
.card .fig .badl { stroke: var(--bad); fill: none; stroke-width: 2; }
.card .fig .badf { fill: var(--bad); }
.card .fig .badsoft { fill: var(--bad-soft); }
.card .fig .shape { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; }
.card .fig .shape.dash2 { stroke-dasharray: 4 3; }
.card .fig .load { fill: var(--load); }
.card .fig .accsoft { fill: var(--acc-soft); }
.card pre { margin: 12px 0 0; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.card pre .c { color: var(--ink2); }
.card pre .h { color: var(--acc); font-weight: 600; }
.qa { margin: 12px 0 0; padding: 8px 0 0 12px; border-left: 3px solid var(--ink); font-size: 14.5px; }
.qa b { font-weight: 650; }
.qa .mono { color: var(--ink2); }
.precise { margin: 12px 0 0; padding: 8px 10px; background: var(--acc-soft); border-radius: 6px; font-size: 14px; }
.precise b { font-weight: 700; color: var(--acc); }
.precise a { color: var(--ink); }
.src { margin: 10px 0 0; font-size: 12px; color: var(--ink2); font-family: var(--f-mono); }
.stack-nav { display: flex; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.stack-nav .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.stack-nav .tabs button { width: 30px; height: 30px; border-radius: 6px; border: 1.5px solid var(--rule); background: var(--sheet); font-family: var(--f-mono); font-size: 12px; }
.stack-nav .tabs button[aria-current="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.stack-nav .arrow { width: 38px; height: 34px; border-radius: 6px; border: 1.5px solid var(--ink); background: none; font-size: 17px; }
.stack-nav .arrow:disabled { opacity: .3; cursor: default; }
.big { font-family: var(--f-mono); font-weight: 500; font-size: 40px; line-height: 1; letter-spacing: -.03em; }

/* toys */
.toy { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--ink2); border-radius: 8px; }
.toy label { font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toy input[type=range] { flex: 1; min-width: 140px; accent-color: var(--acc); }
.toy output { font-family: var(--f-mono); font-size: 14px; }
.toy .boxes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.toy .boxes i { width: 16px; height: 12px; border: 1.5px solid var(--ink); border-radius: 2px; display: block; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.shardcols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.shardcols div { border: 1.5px solid var(--ink); border-radius: 6px; padding: 6px; min-height: 92px; }
.shardcols div.off { border-style: dashed; border-color: var(--rule); }
.shardcols h4 { margin: 0 0 4px; font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--ink2); }
.shardcols span { display: inline-block; font-family: var(--f-mono); font-size: 11px; padding: 1px 3px; margin: 1px; border: 1px solid var(--rule); border-radius: 3px; }
.shardcols span.mv { border-color: var(--acc); background: var(--acc-soft); color: var(--ink); }
.toy .out { margin-top: 8px; font-size: 14px; }

/* run log */
.log { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14.5px; }
.log th { text-align: left; font-size: 12px; color: var(--ink2); font-weight: 500; padding: 0 8px 6px 0; border-bottom: 2px solid var(--ink); }
.log td { vertical-align: top; padding: 10px 8px 10px 0; border-bottom: 1px solid var(--rule); }
.log td:first-child { font-weight: 700; width: 28%; }
.log .tries { font-family: var(--f-mono); font-size: 12px; color: var(--ink2); display: block; margin-top: 3px; font-weight: 400; }
.log button { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; font-size: 14.5px; text-align: left; }

/* notes */
dialog#notes { width: min(820px, 100vw - 24px); max-height: calc(100vh - 40px); border: 1.5px solid var(--ink); border-radius: 12px; background: var(--sheet); color: var(--ink); padding: 0; }
dialog#notes::backdrop { background: rgba(20, 18, 14, .5); }
.notes-in { padding: 22px 26px 36px; }
.notes-in header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; position: sticky; top: 0; background: var(--sheet); padding: 6px 0 10px; z-index: 2; border-bottom: 1px solid var(--rule); }
.notes-in h2 { font-size: 30px; font-weight: 800; font-variation-settings: "wdth" 76; margin: 0; }
.notes-in h3.inc { font-size: 22px; font-weight: 800; font-variation-settings: "wdth" 80; margin: 26px 0 10px; }
.notes-in .card { margin-bottom: 12px; }

/* ---------- phone */
@media (max-width: 860px) {
  .bar { height: auto; flex-wrap: wrap; padding: 8px 16px 0; gap: 4px 10px; }
  .rail { order: 3; flex-basis: 100%; margin: 0 -16px; padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
  .rail button { padding: 8px 8px 7px; font-size: 13px; }
  .desk { display: block; height: auto; min-height: 0; }
  .pager { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
  .pager .msg { flex-wrap: wrap; gap: 4px 10px; }
  .pager .what { font-size: 16px; flex-basis: 100%; order: 3; }
  .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 0; }
  .metric { min-width: 0; padding: 0 10px; }
  .metric:nth-child(odd) { border-left: 0; padding-left: 0; }
  .metric .v { font-size: 17px; }
  .stage-wrap { padding: 8px 12px 10px; }
  #stage { height: auto; flex: none; }
  .stage-cap { font-size: 15px; }
  .panel { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
  .panel-in { padding: 20px 16px 40px; }
  .panel h1 { font-size: 40px; }
  .panel h2 { font-size: 30px; }
  .card { padding: 16px 14px 14px; }
  .card h3 { font-size: 20px; }
  .log td:first-child { width: 34%; }
}
@media (prefers-reduced-motion: reduce) {
  .move, .beats li { transition: none; }
  .move:hover { transform: none; }
}
</style>
</head>
<body>
<header class="bar">
  <button class="brand" id="home" title="Back to the start of the shift">On call <span>· Medium</span></button>
  <nav class="rail" id="rail" aria-label="Incidents"></nav>
  <div class="tools">
    <button id="notesBtn" aria-haspopup="dialog">Notes</button>
    <button id="themeBtn" aria-label="Switch colour theme">Dark</button>
  </div>
</header>

<main class="desk">
  <section class="pager" aria-label="Pager">
    <div class="msg"><span class="when" id="when"></span><span class="eg" id="eg">example incident</span><span class="what" id="what"></span></div>
    <dl class="metrics" id="metrics"></dl>
  </section>

  <section class="stage-wrap" aria-label="Live system">
    <svg id="stage" role="img" aria-labelledby="stageDesc"><desc id="stageDesc">The system right now.</desc>
      <g id="lWires"></g><g id="lNodes"></g><g id="lDots"></g><g id="lMarks"></g>
    </svg>
    <div class="stage-foot">
      <div class="stage-cap" id="cap" aria-live="polite"></div>
      <div class="legend" aria-hidden="true">
        <span><svg width="12" height="12"><circle class="g-r" cx="6" cy="6" r="4"/></svg> read</span>
        <span><svg width="12" height="12"><rect class="g-w" x="2" y="2" width="8" height="8"/></svg> write</span>
        <span><svg width="12" height="12"><path class="g-x" d="M2 2L10 10M10 2L2 10"/></svg> failed</span>
        <span><svg width="14" height="16"><ellipse class="g-rep" cx="7" cy="3.5" rx="5.5" ry="2"/><path class="g-rep" d="M1.5 3.5V12.5A5.5 2 0 0 0 12.5 12.5V3.5"/></svg> replica</span>
        <span class="toy-tag">toy model</span>
      </div>
      <button class="motion" id="motionBtn" aria-pressed="false">Pause motion</button>
    </div>
  </section>

  <aside class="panel" id="panel" aria-live="polite"><div class="panel-in" id="panelIn"></div></aside>
</main>

<dialog id="notes" aria-labelledby="notesTitle"><div class="notes-in">
  <header><h2 id="notesTitle">Every debrief, in order</h2><button class="secondary" id="notesClose">Close</button></header>
  <div id="notesBody"></div>
</div></dialog>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, html) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; };
const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const RM = window.matchMedia("(prefers-reduced-motion: reduce)");
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const NUM = ["①", "②", "③", "④"];

/* ================= system states (toy model) ================= */
// u = position along the request flow inside the data area (0 near the API tier, 1 far), v = position across (0..1)
const N = (id, kind, u, v, util, x = {}) => Object.assign({ id, kind, u, v, util }, x);
const st = (o) => Object.assign({ api: 3, apiU: .3, nodes: [], reads: {}, writes: {}, rate: 1, rf: .9, links: [], marks: [], focus: null }, o);
const M1 = (util, size, x = {}) => N("m", "master", .12, .2, util, Object.assign({ label: "master", size }, x));
const reps = (n, util, parent = "m", u = .62, v0 = .44, v1 = .96) => Array.from({ length: n }, (_, i) => N("r" + (i + 1), "replica", u, n === 1 ? (v0 + v1) / 2 : v0 + (v1 - v0) * i / (n - 1), Array.isArray(util) ? util[i] : util, { parent, label: "replica" }));
const even = (ids) => Object.fromEntries(ids.map((i) => [i, 1]));
const pulls = (ids, to = "m") => ids.map((i) => ({ from: i, to, kind: "pull" }));

/* ---------- Incident 1 */
const i1start = st({ api: 3, apiU: .41, rate: 1.7, nodes: [M1(.98, "32 GB")], reads: { m: 1 }, writes: { m: 1 } });
const i1fixed = st({ api: 3, apiU: .41, rate: 1.7, nodes: [M1(.55, "64 GB")], reads: { m: 1 }, writes: { m: 1 } });
/* ---------- Incident 2 */
const i2start = st({ api: 6, apiU: .5, rate: 1.4, nodes: [M1(.91, "4 TB")], reads: { m: 1 }, writes: { m: 1 }, marks: [{ type: "ladder", node: "m" }] });
const i2rep = (mu, ru, routed) => st({ api: 6, apiU: .5, rate: 1.4, nodes: [M1(mu, "4 TB"), ...reps(2, ru)], reads: routed ? even(["r1", "r2"]) : { m: 1 }, writes: { m: 1 }, links: pulls(["r1", "r2"]) });
const shards3 = (util, x = {}) => [0, 1, 2].map((i) => N("s" + i, "master", .12, [.12, .5, .88][i], util, Object.assign({ label: "shard " + i, size: "⅓ users" }, x)));
/* ---------- Incident 3 */
const i3base = (o = {}) => st(Object.assign({ api: 6, apiU: .45, rate: 1.3, nodes: [M1(.24, "4 TB"), ...reps(2, .42)], reads: even(["r1", "r2"]), writes: { m: 1 }, links: pulls(["r1", "r2"]) }, o));
/* ---------- Incident 4 */
const i4base = (mu, ru, o = {}) => st(Object.assign({ api: 12, apiU: .5, rate: 2, nodes: [M1(mu, "4 TB"), ...reps(5, ru)], reads: even(["r1", "r2", "r3", "r4", "r5"]), writes: { m: 1 }, links: pulls(["r1", "r2", "r3", "r4", "r5"]) }, o));
function i4wide(mu) { const r = reps(15, .3, "m", .62, .4, .98); r.forEach((n, i) => { n.util = i < 5 ? .35 : .28; }); return st({ api: 12, apiU: .5, rate: 2, nodes: [M1(mu, "4 TB"), ...r], reads: even(r.map((n) => n.id)), writes: { m: 1 }, links: pulls(r.map((n) => n.id)), marks: [{ type: "note", node: "r15", text: "15 replicas", side: "after" }] }); }
function i4tree() {
  const top = reps(5, .42, "m", .5, .42, .96);
  const kids = [];
  top.forEach((p, i) => { [-.045, .045].forEach((d, j) => kids.push(N("c" + i + j, "replica", .93, p.v + d, .4, { parent: p.id, label: "replica" }))); });
  return st({ api: 12, apiU: .5, rate: 2, nodes: [M1(.62, "4 TB"), ...top, ...kids], reads: even([...top, ...kids].map((n) => n.id)), writes: { m: 1 }, links: [...pulls(top.map((n) => n.id)), ...kids.map((k) => ({ from: k.id, to: k.parent, kind: "pull2" }))] });
}
function i4cache(ru, cacheShare) { const s = i4base(.62, ru); s.nodes.push(N("k", "cache", .62, .12, .5, { label: "cache" })); const r = {}; ["r1", "r2", "r3", "r4", "r5"].forEach((i) => r[i] = (1 - cacheShare) / 5); r.k = cacheShare; s.reads = r; return s; }
/* ---------- Incident 5 */
const i5start = st({ api: 12, apiU: .55, rate: 1.8, rf: .55, nodes: [M1(.94, "4 TB"), ...reps(3, .4)], reads: even(["r1", "r2", "r3"]), writes: { m: 1 }, links: pulls(["r1", "r2", "r3"]) });
function i5mm(conflict) { return st({ api: 12, apiU: .55, rate: 1.8, rf: .55, nodes: [N("m", "master", .12, .18, .52, { label: "master A", size: "4 TB" }), N("m2", "master", .12, .62, .5, { label: "master B", size: "4 TB" })], reads: { m: 1, m2: 1 }, writes: { m: 1, m2: 1 }, links: [{ from: "m", to: "m2", kind: conflict ? "conflict" : "sync" }] }); }
function i5vert() { return st({ api: 12, apiU: .55, rate: 1.8, rf: .55, nodes: [N("m", "master", .12, .2, .71, { label: "30 tables", size: "posts…" }), N("m2", "master", .12, .72, .26, { label: "70 tables", size: "the rest" })], reads: { m: 3, m2: 1 }, writes: { m: 3, m2: 1 } }); }
function i5shard(withReps) {
  const s = shards3(.33);
  const nodes = [...s]; const links = []; const reads = {}; const writes = {};
  s.forEach((m) => { writes[m.id] = 1; reads[m.id] = 1; if (withReps) { const r = N("r" + m.id, "replica", .62, m.v + .1, .3, { parent: m.id, label: "replica" }); nodes.push(r); links.push({ from: r.id, to: m.id, kind: "pull" }); reads[r.id] = 2; reads[m.id] = 0; } });
  return st({ api: 12, apiU: .55, rate: 1.8, rf: .55, nodes, reads, writes, links });
}

/* ================= metrics ================= */
const fmt = {
  pct: (v) => Math.round(v) + "%",
  ms: (v) => v >= 1000 ? (v / 1000).toFixed(1) + " s" : Math.round(v) + " ms",
  n: (v) => Math.round(v).toLocaleString("en-US"),
  s: (v) => v.toFixed(1) + " s",
  txt: (v) => String(v)
};

/* ================= figures for debrief cards ================= */
const cyl = (x, y, w, h, cls = "shape", lab = "") => { const ry = Math.max(3, h * .16); return `<path class="${cls}" d="M${x - w / 2} ${y - h / 2 + ry} A${w / 2} ${ry} 0 0 1 ${x + w / 2} ${y - h / 2 + ry} V${y + h / 2 - ry} A${w / 2} ${ry} 0 0 1 ${x - w / 2} ${y + h / 2 - ry} Z"/><path class="${cls}" d="M${x - w / 2} ${y - h / 2 + ry} A${w / 2} ${ry} 0 0 0 ${x + w / 2} ${y - h / 2 + ry}"/>` + (lab ? `<text x="${x}" y="${y + h / 2 + 15}" text-anchor="middle">${lab}</text>` : ""); };
const arrowDef = (id, cls = "") => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:${cls || "var(--ink)"}"/></marker></defs>`;
const FIG = {
  together: () => `<svg viewBox="0 0 440 120" aria-label="The same 40 requests spread over a day, then arriving within one minute">
    <text x="0" y="20" class="s">spread over a day</text>${Array.from({ length: 40 }, (_, i) => `<line class="ln2" x1="${14 + i * 10.5}" x2="${14 + i * 10.5}" y1="32" y2="46"/>`).join("")}
    <text x="0" y="78" class="s">same 40, inside one minute</text>${Array.from({ length: 40 }, (_, i) => `<line class="badl" style="stroke-width:1.4" x1="${300 + i * 2.2}" x2="${300 + i * 2.2}" y1="90" y2="112"/>`).join("")}
    <line class="ln2" x1="10" x2="430" y1="112" y2="112"/></svg>`,
  hulk: () => `<svg viewBox="0 0 440 150" aria-label="Hulk: one bigger machine. Minions: more machines">
    ${cyl(70, 70, 92, 96)}<text x="70" y="140" text-anchor="middle" font-weight="700">Hulk</text><text x="70" y="74" text-anchor="middle" class="s">CPU RAM disk ↑</text>
    ${cyl(250, 80, 40, 46)}${cyl(310, 80, 40, 46)}${cyl(370, 80, 40, 46)}<text x="310" y="140" text-anchor="middle" font-weight="700">Minions</text><text x="310" y="40" text-anchor="middle" class="s">more machines</text></svg>`,
  bottomup: () => `<svg viewBox="0 0 440 150" aria-label="User, API, DB. Scale the DB first, then the API servers">
    <circle class="shape" cx="26" cy="46" r="9"/><path class="ln" d="M26 55V78M14 64H38M26 78L16 94M26 78L36 94"/>
    <line class="ln" x1="46" x2="150" y1="62" y2="62"/><rect class="shape" x="150" y="44" width="92" height="36" rx="4"/><text x="196" y="67" text-anchor="middle" class="m">API</text>
    <line class="ln" x1="242" x2="340" y1="62" y2="62"/>${cyl(370, 62, 46, 50)}<text x="370" y="66" text-anchor="middle" class="m">DB</text>

    <path class="ln2" d="M196 88V112"/><text x="196" y="132" text-anchor="middle">② then API servers</text></svg>`,

    ${arrowDef("a1")}<line class="ln2" x1="30" y1="130" x2="430" y2="130" marker-end="url(#a1)"/><line class="ln2" x1="30" y1="130" x2="30" y2="10" marker-end="url(#a1)"/>
    <path class="badsoft" d="M120 30H330V60H270V80H200V100H120Z"/>

  ladder: () => { const s = ["16 GB", "32", "64", "128", "256", "512", "1 TB", "2", "4 TB"]; return `<svg viewBox="0 0 440 140" aria-label="Machine sizes from 16 GB to 4 TB; there is no next size">
    ${s.map((t, i) => `<rect class="load" x="${12 + i * 42}" y="${110 - (14 + i * 10.5)}" width="30" height="${14 + i * 10.5}"/><text x="${27 + i * 42}" y="128" text-anchor="middle" class="m">${t}</text>`).join("")}

  sd: () => `<svg viewBox="0 0 440 90" aria-label="A phone slot rated 256 GB does not recognise a 512 GB card">
    <rect class="shape" x="10" y="10" width="120" height="66" rx="8"/><rect class="load" x="38" y="44" width="64" height="18" rx="2"/><text x="70" y="34" text-anchor="middle" class="m">slot ≤ 256 GB</text>

  split: () => `<svg viewBox="0 0 440 76" aria-label="Reads versus writes"><rect class="load" id="splitR" x="0" y="20" width="396" height="30"/><rect class="accsoft" style="stroke:var(--acc)" id="splitW" x="396" y="20" width="44" height="30"/><text x="10" y="40" id="splitRt">reads 90%</text><text x="436" y="68" text-anchor="end" id="splitWt" style="fill:var(--acc)">writes 10%</text></svg>`,
  replicas: () => `<svg viewBox="0 0 440 170" aria-label="API sends writes to the master and reads to replicas; replicas pull changes from the master">${arrowDef("a2")}${arrowDef("a3", "var(--ink2)")}
    <rect class="shape" x="20" y="64" width="80" height="34" rx="4"/><text x="60" y="86" text-anchor="middle" class="m">API</text>
    <path class="ln" d="M100 74H176" marker-end="url(#a2)"/><text x="138" y="66" text-anchor="middle" class="s">writes</text>
    <path class="ln" d="M100 90H140V140H296" marker-end="url(#a2)"/><text x="196" y="134" class="s">reads</text>

  pull: () => `<svg viewBox="0 0 440 128" aria-label="The replica asks the master for changes since a position; the master then streams changes over that connection">${arrowDef("a4")}${arrowDef("a5", "var(--ink2)")}

    <path class="ln" d="M348 46H94" marker-end="url(#a4)"/><text x="220" y="38" text-anchor="middle">① "changes after position 812?"</text>
    <path class="dash" d="M94 82H348" marker-end="url(#a5)"/><text x="220" y="104" text-anchor="middle" class="s">② events flow back on that same connection</text></svg>`,
  lag: () => `<svg viewBox="0 0 440 150" aria-label="Timeline: the write lands on the master at time zero, a read from the replica at 0.5 s returns the old value, the replica catches up at 1.8 s">${arrowDef("a6")}${arrowDef("a7", "var(--ink2)")}
    <text x="0" y="30" class="s">writer</text><text x="0" y="78" class="s">master</text><text x="0" y="126" class="s">replica</text>
    <line class="ln2" x1="64" x2="430" y1="74" y2="74"/><line class="ln2" x1="64" x2="430" y1="122" y2="122"/><line class="ln2" x1="64" x2="430" y1="26" y2="26"/>
    <path class="ln" d="M90 26V70" marker-end="url(#a6)"/><text x="96" y="50">publish → 75</text>

  bank: () => `<svg viewBox="0 0 440 120" aria-label="Profile reads can go to a replica; balance reads must go to the master">${arrowDef("a8")}

    <text x="0" y="96" font-weight="700">balance</text><path class="acc" d="M70 92H250" marker-end="url(#a8)"/>${cyl(286, 92, 44, 40)}<text x="318" y="96">master: must be current</text></svg>`,
  proxy: () => `<svg viewBox="0 0 440 120" aria-label="With one connection string, a proxy layer routes to master and replicas">${arrowDef("a9")}

  pools: () => `<svg viewBox="0 0 440 130" aria-label="One API server keeps a separate connection pool for each database">

    ${[0, 1, 2].map((i) => `<g>${[0, 1, 2, 3].map((j) => `<rect class="load" x="${24 + j * 14}" y="${54 + i * 18}" width="10" height="12"/>`).join("")}<text x="88" y="${64 + i * 18}" class="m s">pool ${i + 1}</text><path class="ln2" d="M160 ${60 + i * 18}H${300}V${22 + i * 44}H330"/>${cyl(354, 22 + i * 44, 40, 32)}</g>`).join("")}</svg>`,
  tax: () => { const bar = (y, w, n, lab) => `<text x="0" y="${y + 18}" class="s">${lab}</text><rect class="load" x="110" y="${y}" width="${w}" height="26"/>${Array.from({ length: n }, (_, i) => `<rect class="accsoft" style="stroke:var(--acc)" x="${110 + w + i * 19}" y="${y}" width="19" height="26"/>`).join("")}`; return `<svg viewBox="0 0 440 112" aria-label="Master CPU: writes plus a slice per replica">${bar(10, 120, 5, "5 replicas")}${bar(54, 120, 15, "15 replicas")}<text x="110" y="104" class="s">writes</text><text x="236" y="104" style="fill:var(--acc)">+ one slice per replica pulling changes</text></svg>`; },
  tree: () => { let s = `<svg viewBox="0 0 440 150" aria-label="One master, five replicas, each feeding two more: fifteen replicas, five of them on the master">${arrowDef("b1", "var(--ink2)")}${cyl(40, 75, 44, 46)}<text x="40" y="136" text-anchor="middle" class="m s">master</text>`; for (let i = 0; i < 5; i++) { const y = 15 + i * 30; s += `<path class="dash" d="M154 ${y}H100V75H64" marker-end="url(#b1)"/>` + cyl(176, y, 34, 24, "shape dash2"); for (let j = 0; j < 2; j++) { const x = 270 + j * 54; s += `<path class="dash" d="M${x - 16} ${y}H${x - 54 + 28}" />` + cyl(x, y, 30, 22, "shape dash2"); } } return s + `<text x="430" y="146" text-anchor="end" class="m s">5 + 10 = 15</text></svg>`; },

    </svg>`; },
  hotkey: () => `<svg viewBox="0 0 440 130" aria-label="Writes per shard: even when sharded by user id, all on the newest shard when sharded by creation date">

    <text x="240" y="16" font-weight="700">by created_at</text>${[0, 1, 2].map((i) => `<rect class="${i === 2 ? "badsoft" : "load"}" style="${i === 2 ? "stroke:var(--bad)" : ""}" x="${260 + i * 60}" y="${116 - (i === 2 ? 96 : 4)}" width="40" height="${i === 2 ? 96 : 4}"/><text x="${280 + i * 60}" y="128" text-anchor="middle" class="m s">${["2024", "2025", "now"][i]}</text>`).join("")}</svg>`,
  multimaster: () => `<svg viewBox="0 0 440 120" aria-label="Two masters both accept an edit to the same post; which one wins?">${arrowDef("b2", "var(--ink2)")}
    ${cyl(70, 56, 56, 60)}<text x="70" y="60" text-anchor="middle" class="m">A</text>${cyl(370, 56, 56, 60)}<text x="370" y="60" text-anchor="middle" class="m">B</text>

const TOY = {
  rps: () => `<div class="toy" data-toy="rps"><label>Expected traffic <input type="range" min="100" max="2000" step="100" value="500" aria-label="Expected requests per second"><output>500 req/s</output></label><div class="out">÷ 100 req/s per machine (class example) = <b class="mono" data-o>5 machines</b></div><div class="boxes" aria-hidden="true"></div></div>`,
  ratio: () => `<div class="toy" data-toy="ratio"><span class="seg" role="group" aria-label="Read to write ratio"><button aria-pressed="true" data-r="90">90 : 10</button><button aria-pressed="false" data-r="99">99 : 1</button></span></div>`,
  reshard: () => `<div class="toy" data-toy="reshard"><div class="row" style="margin-top:0"><span class="seg" role="group" aria-label="Routing scheme"><button aria-pressed="true" data-m="mod">hash mod N</button><button aria-pressed="false" data-m="bucket">fixed buckets</button></span><button class="secondary" data-add style="padding:5px 12px">Add shard 3</button><button class="linkish" data-reset>reset</button></div><div class="shardcols" aria-live="polite"></div><div class="out" data-o>24 users on 3 shards.</div></div>`
};
function initToys(root) {
  root.querySelectorAll('[data-toy="rps"]').forEach((t) => {
    const r = t.querySelector("input"), o = t.querySelector("output"), b = t.querySelector("[data-o]"), bx = t.querySelector(".boxes");
    const up = () => { const v = +r.value, n = Math.ceil(v / 100); o.textContent = v.toLocaleString("en-US") + " req/s"; b.textContent = n + (n === 1 ? " machine" : " machines"); bx.innerHTML = "<i></i>".repeat(n); };
    r.addEventListener("input", up); up();
  });
  root.querySelectorAll('[data-toy="ratio"]').forEach((t) => {
    const card = t.closest(".card");
    t.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      t.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); const r = +b.dataset.r;
      const W = 440 * (100 - r) / 100; const R = card.querySelector("#splitR"), Wr = card.querySelector("#splitW");
      if (R) { R.setAttribute("width", 440 - W); Wr.setAttribute("x", 440 - W); Wr.setAttribute("width", W); card.querySelector("#splitRt").textContent = "reads " + r + "%"; card.querySelector("#splitWt").textContent = "writes " + (100 - r) + "%"; }
    }));
  });
  root.querySelectorAll('[data-toy="reshard"]').forEach((t) => {
    const users = Array.from({ length: 24 }, (_, i) => 101 + i * 7);
    const h = (id) => { let x = id * 2654435761 >>> 0; x ^= x >>> 13; x = Math.imul(x, 1274126177) >>> 0; return (x ^ (x >>> 16)) >>> 0; };
    let mode = "mod", n = 3;
    const B = 12; const bucket3 = (b) => b % 3; const bucket4 = (b) => (b === 3 || b === 7 || b === 11) ? 3 : b % 3; // move one bucket from each old shard
    const place = (id, k) => mode === "mod" ? h(id) % k : (k === 3 ? bucket3(h(id) % B) : bucket4(h(id) % B));
    const cols = t.querySelector(".shardcols"), out = t.querySelector("[data-o]"), add = t.querySelector("[data-add]");
    const draw = () => {
      const moved = new Set(); if (n === 4) users.forEach((u) => { if (place(u, 3) !== place(u, 4)) moved.add(u); });
      cols.innerHTML = [0, 1, 2, 3].map((s) => `<div class="${s >= n ? "off" : ""}"><h4>shard ${s}</h4>${s < n ? users.filter((u) => place(u, n) === s).map((u) => `<span class="${moved.has(u) ? "mv" : ""}">${u}</span>`).join("") : ""}</div>`).join("");
      out.innerHTML = n === 3 ? "24 users on 3 shards. Add a fourth and see who has to move." : `<b>${moved.size} of 24</b> users moved (${Math.round(moved.size / 24 * 100)}%). ${mode === "mod" ? "Changing N reshuffles almost everyone." : "Only the buckets handed to shard 3 moved."}`;
      add.disabled = n === 4;
    };
    t.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => { mode = b.dataset.m; t.querySelectorAll("[data-m]").forEach((x) => x.setAttribute("aria-pressed", x === b)); draw(); }));
    add.addEventListener("click", () => { n = 4; draw(); });
    t.querySelector("[data-reset]").addEventListener("click", () => { n = 3; draw(); });
    draw();
  });
}

function setupMetrics(defs, vals) {

  metricsEl.innerHTML = defs.map(([key, label]) => `<div class="metric" data-m="${key}"><dt>${label}</dt><dd><span class="v"></span><svg viewBox="0 0 48 18" aria-hidden="true"><path/></svg></dd></div>`).join("");

}
function setMetrics(vals, instant) { Object.assign(mTarget, vals); if (instant || !motionOn) Object.assign(mVals, vals); paintMetrics(); }
function paintMetrics() {
  mDefs.forEach(([k, , f, bad]) => {
    const box = metricsEl.querySelector(`[data-m="${k}"]`); if (!box) return;
    const v = mVals[k]; box.querySelector(".v").textContent = v == null ? "—" : fmt[f](v);
    box.classList.toggle("bad", typeof v === "number" && bad(v));
    const h = mHist[k]; if (h.length > 1 && typeof h[0] === "number") {
      const mx = Math.max(...h, 1), mn = Math.min(...h, 0);
      box.querySelector("path").setAttribute("d", h.map((x, i) => `${i ? "L" : "M"}${(i / (h.length - 1) * 48).toFixed(1)} ${(17 - (x - mn) / ((mx - mn) || 1) * 16).toFixed(1)}`).join(""));
    } else box.querySelector("path").setAttribute("d", "");
  });
}
function tickMetrics(dt) {
  let changed = false;
  mDefs.forEach(([k, , f]) => {
    const t = mTarget[k];
    if (typeof t === "number") {
      const v = typeof mVals[k] === "number" ? mVals[k] : t;
      const nv = Math.abs(t - v) < .01 * Math.max(1, Math.abs(t)) ? t : v + (t - v) * Math.min(1, dt * 4);
      if (nv !== mVals[k]) { mVals[k] = f === "s" ? nv : nv; changed = true; }
    } else if (mVals[k] !== t) { mVals[k] = t; changed = true; }
  });
  return changed;
}
let histClock = 0;
function sampleHist() { mDefs.forEach(([k]) => { const v = mVals[k]; if (typeof v === "number") { const j = motionOn && v > 0 ? v * (1 + (Math.random() - .5) * .03) : v; mHist[k].push(j); if (mHist[k].length > 32) mHist[k].shift(); } }); }

  stopBeats(); app.cur = -1; app.view = "intro"; app.beat = -1; railPaint();
  setPager("Monday · 08:55", "Quiet. 3 API servers, one Postgres master on a 32 GB machine.", true);
  setupMetrics([["cpu", "db CPU", "pct", (v) => v > 85], ["p99", "p99", "ms", (v) => v > 800], ["err", "errors/min", "n", (v) => v > 50], ["api", "API CPU", "pct", (v) => v > 85]], { cpu: 31, p99: 70, err: 0, api: 22 });
  drawStage(st({ api: 3, apiU: .22, rate: .7, nodes: [M1(.31, "32 GB")], reads: { m: 1 }, writes: { m: 1 } }));
  setCap("");
  panelIn.innerHTML = `<h1>You're on call for Medium.</h1>
    <p class="lede">Five pages tonight, all about one thing: the database running out of room.</p>
    <p class="lede">Each page: read the alert, pick a move, watch the system, then open the debrief. Any move can be retried. Times and metrics are examples in a toy model; the debriefs carry the class's numbers and timestamps.</p>
    <div class="row"><button class="primary" id="go">Take the pager</button><button class="linkish" id="skipNotes">Read the debriefs without playing</button></div>`;
  $("#go").addEventListener("click", () => showIncident(0)); $("#skipNotes").addEventListener("click", openNotes);
  scrollPanelTop();
}

function showIncident(i, opts = {}) {
  stopBeats(); app.debStage = null; const inc = INC[i]; app.cur = i; app.view = "brief"; app.beat = -1; railPaint();
  setPager(inc.when, inc.what, true);
  setupMetrics(inc.metrics, inc.m0);
  clearDots(); drawStage(inc.start); setCap("");
  const tried = app.tried[inc.id];
  panelIn.innerHTML = `<h2 data-k="${inc.k}">${inc.title}</h2><p class="ask">${inc.ask}</p>
    <ul class="moves">${inc.moves.map((m, j) => `<li><button class="move${tried.includes(m.key) ? " tried" : ""}" data-j="${j}" data-k="${m.k}"><span class="key">${m.key}</span><b>${m.label}</b><small>${m.hint}</small></button></li>`).join("")}</ul>
    ${tried.length ? `<div class="row"><button class="linkish" id="toDeb">Open the debrief</button></div>` : ""}`;
  panelIn.querySelectorAll(".move").forEach((b) => b.addEventListener("click", () => runMove(i, +b.dataset.j)));
  const td = $("#toDeb"); if (td) td.addEventListener("click", () => showDebrief(i, 0));
  scrollPanelTop(); if (!opts.noFocus) focusPanel();
}

function runMove(i, j) {
  stopBeats(); app.debStage = null; const inc = INC[i], mv = inc.moves[j]; app.view = "outcome"; app.moveIdx = j;
  const tr = app.tried[inc.id]; tr.push(mv.key); railPaint();
  panelIn.innerHTML = `<p class="chose">Your move: <b>${mv.label}</b></p><h3 class="vh">What happened</h3>
    <ol class="beats">${mv.beats.map((b, n) => `<li data-n="${n}"><span class="n">${n + 1}</span><span>${b[0]}</span></li>`).join("")}</ol>
    <div class="verdict" hidden><span class="tag">${{ fix: "this holds", miss: "the page keeps firing", costly: "it holds, at a price" }[mv.kind]}</span><h3 data-k="${mv.k}">${mv.verdict}</h3><p>${mv.note}</p>
    <div class="row"><button class="primary" id="deb">Open the debrief</button><button class="secondary" id="retry">Try another move</button>${i < 4 ? `<button class="linkish" id="next">Next page →</button>` : `<button class="linkish" id="next">Shift log →</button>`}</div></div>`;
  $("#deb").addEventListener("click", () => showDebrief(i, 0));
  $("#retry").addEventListener("click", () => showIncident(i));
  $("#next").addEventListener("click", () => i < 4 ? showIncident(i + 1) : showEnd());
  scrollPanelTop();
  if (mqPhone.matches) { const sw = $(".stage-wrap"); sw.scrollIntoView({ behavior: motionOn ? "smooth" : "auto", block: "start" }); }
  const step = (n) => {
    app.beat = n; const b = mv.beats[n];
    drawStage(b[1]); setMetrics(b[2]);
    setCap(`<span class="n">${n + 1}</span><span>${b[0]}</span>`);
    panelIn.querySelectorAll(".beats li").forEach((li, k) => { li.classList.toggle("on", k === n); li.classList.toggle("past", k < n); });
    if (n < mv.beats.length - 1) app.timer = setTimeout(() => step(n + 1), motionOn ? 2300 : 0);
    else { const v = panelIn.querySelector(".verdict"); v.hidden = false; panelIn.querySelectorAll(".beats li").forEach((li) => li.classList.add("on")); }
  };
  if (!motionOn) { mv.beats.forEach((_, n) => step(n)); stopBeats(); } else step(0);
}

function cardHTML(c, inc) {
  const links = (p) => p.slice(1).map(([u, l]) => `<a href="${u}" target="_blank" rel="noopener">${l}</a>`).join(" · ");
  return `<article class="card" data-k="${c.k}"><h3>${c.t}</h3>
    ${c.fig ? `<div class="fig">${FIG[c.fig]()}</div>` : ""}
    ${c.b || ""}
    ${c.fig2 ? `<div class="fig">${FIG[c.fig2]()}</div>` : ""}
    ${c.code ? `<pre>${c.code}</pre>` : ""}
    ${c.toy ? TOY[c.toy]() : ""}
    ${(c.qa || []).map(([q, a, ts]) => `<div class="qa"><b>From the class Q&amp;A:</b> ${q} <span>${a}</span> <span class="mono">${ts}</span></div>`).join("")}
    ${c.precise ? `<div class="precise"><b>More precisely:</b> ${c.precise[0]} ${c.precise.length > 1 ? links(c.precise) : ""}</div>` : ""}
    <p class="src">${c.src}</p></article>`;
}
function showDebrief(i, k) {
  stopBeats(); const inc = INC[i]; app.cur = i; app.view = "debrief"; app.card = k; railPaint();
  if (!app.tried[inc.id].length) app.tried[inc.id].push("—");
  const n = inc.cards.length; const c = inc.cards[k];
  panelIn.innerHTML = `<div class="deb-head"><h2 style="font-size:28px">Debrief: ${inc.short.toLowerCase()}</h2><span class="mono">${k + 1} / ${n}</span></div>
    <div class="stack${k === n - 1 ? " last" : ""}" id="stack" tabindex="0" aria-label="Debrief cards. Left and right arrow keys move between cards.">${cardHTML(c, inc)}</div>
    <div class="stack-nav"><button class="arrow" id="prev" aria-label="Previous card" ${k === 0 ? "disabled" : ""}>←</button>
      <div class="tabs">${inc.cards.map((cc, j) => `<button data-c="${j}" aria-current="${j === k}" title="${cc.t.replace(/"/g, "&quot;")}" aria-label="Card ${j + 1}: ${cc.t.replace(/"/g, "&quot;")}">${j + 1}</button>`).join("")}</div>
      <button class="arrow" id="nextc" aria-label="Next card" ${k === n - 1 ? "disabled" : ""}>→</button></div>
    <div class="row"><button class="primary" id="nextp">${i < 4 ? "Next page →" : "Shift log →"}</button><button class="secondary" id="back">Back to the moves</button></div>`;
  initToys(panelIn);
  $("#prev").addEventListener("click", () => showDebrief(i, k - 1));
  $("#nextc").addEventListener("click", () => showDebrief(i, k + 1));
  panelIn.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => showDebrief(i, +b.dataset.c)));
  $("#stack").addEventListener("keydown", (e) => { if (e.key === "ArrowRight" && k < n - 1) { showDebrief(i, k + 1); $("#stack").focus(); } if (e.key === "ArrowLeft" && k > 0) { showDebrief(i, k - 1); $("#stack").focus(); } });
  $("#nextp").addEventListener("click", () => i < 4 ? showIncident(i + 1) : showEnd());
  $("#back").addEventListener("click", () => showIncident(i));
  // keep the stage in the incident's resolved state while reading
  const fixMove = inc.moves.find((m) => m.kind === "fix"); const fin = fixMove.beats[fixMove.beats.length - 1];
  if (app.debStage !== i) { app.debStage = i; app.beat = -1; setPager(inc.when, inc.what, true); setupMetrics(inc.metrics, fin[2]); clearDots(); drawStage(Object.assign({}, fin[1], { focus: null })); setCap(`<span>Resolved state after “${fixMove.label.toLowerCase()}”.</span>`); }
  scrollPanelTop();
}

function showEnd() {
  stopBeats(); app.debStage = null; app.cur = 5; app.view = "end"; app.beat = -1; railPaint();
  setPager("Shift over", "Five pages. The database went from one 32 GB machine to three shards with replicas.", false);
  setupMetrics([["cpu", "write CPU", "pct", (v) => v > 85], ["wp99", "write p99", "ms", (v) => v > 300], ["n", "replicas", "n", () => false], ["dbs", "masters", "txt", () => false]], { cpu: 33, wp99: 40, n: 3, dbs: "3 shards" });
  clearDots(); drawStage(i5shard(true)); setCap("<span>Where the night ended: sharded by user ID, a replica per shard.</span>");
  const kindWord = { fix: "held", miss: "kept firing", costly: "held, at a price" };
  const rows = INC.map((inc, i) => {
    const tr = app.tried[inc.id].filter((x) => x !== "—");
    const trs = tr.length ? tr.map((key) => { const m = inc.moves.find((x) => x.key === key); return `${m.label.toLowerCase()} (${kindWord[m.kind]})`; }).join(" → ") : "not played";
    return `<tr><td>${inc.short}<span class="tries">${trs}</span></td><td>${inc.cards.map((c, j) => `<button data-i="${i}" data-c="${j}">${c.t}</button>`).join("<br>")}</td></tr>`;
  }).join("");
  panelIn.innerHTML = `<h2>Shift log</h2><p class="lede">Each page, what you tried, and what it maps to in the lecture. Open any line to reread that card.</p>
    <table class="log"><thead><tr><th>Page · your moves</th><th>Concepts</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="row"><button class="primary" id="again">Run the shift again</button><button class="secondary" id="allNotes">All debriefs on one page</button></div>`;
  panelIn.querySelectorAll(".log button").forEach((b) => b.addEventListener("click", () => showDebrief(+b.dataset.i, +b.dataset.c)));
  $("#again").addEventListener("click", () => { INC.forEach((x) => app.tried[x.id] = []); showIncident(0); });
  $("#allNotes").addEventListener("click", openNotes);
  scrollPanelTop(); focusPanel();
}

/* ================= notes ================= */
const notes = $("#notes");
function openNotes() {
  const body = $("#notesBody");
  if (!body.dataset.done) {
    body.innerHTML = INC.map((inc) => `<h3 class="inc" data-k="${inc.k}">${inc.short}: ${inc.title}</h3><p class="src" style="margin:-4px 0 10px">${inc.when} (example) · ${inc.what}</p>` + inc.moves.map((m) => `<p class="src" data-k="${m.k}" style="font-family:var(--f-ui);font-size:14px;margin:4px 0">Move ${m.key}, ${m.label.toLowerCase()}: ${m.verdict} ${m.note}</p>`).join("") + inc.cards.map((c) => cardHTML(c, inc)).join("")).join("");
    body.querySelectorAll("[id^=split]").forEach((e) => e.removeAttribute("id"));
    body.querySelectorAll('[data-toy="ratio"]').forEach((t) => t.remove());
    initToys(body); body.dataset.done = "1";
  }
  if (typeof notes.showModal === "function") notes.showModal(); else notes.setAttribute("open", "");
}
$("#notesBtn").addEventListener("click", openNotes);
$("#notesClose").addEventListener("click", () => notes.close());

/* ================= theme + motion ================= */
const root = document.documentElement;
function curTheme() { const t = root.getAttribute("data-theme"); if (t) return t; return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
function paintThemeBtn() { $("#themeBtn").textContent = curTheme() === "dark" ? "Light" : "Dark"; }
const saved = store.get("oc-theme"); if (saved) root.setAttribute("data-theme", saved);
paintThemeBtn();
$("#themeBtn").addEventListener("click", () => { const n = curTheme() === "dark" ? "light" : "dark"; root.setAttribute("data-theme", n); store.set("oc-theme", n); paintThemeBtn(); });
let motionOn = !RM.matches;
function paintMotion() { $("#motionBtn").textContent = motionOn ? "Pause motion" : "Play motion"; $("#motionBtn").setAttribute("aria-pressed", String(!motionOn)); }
$("#motionBtn").addEventListener("click", () => { motionOn = !motionOn; if (!motionOn) clearDots(); paintMotion(); if (cur) drawStage(cur); });
RM.addEventListener && RM.addEventListener("change", () => { motionOn = !RM.matches; if (!motionOn) clearDots(); paintMotion(); });
paintMotion();
document.addEventListener("visibilitychange", () => { running = !document.hidden; });
function setOrient() { const o = mqPhone.matches ? "port" : "land"; if (o !== orient) { orient = o; clearDots(); if (cur) drawStage(cur); } }
mqPhone.addEventListener && mqPhone.addEventListener("change", setOrient);
orient = mqPhone.matches ? "port" : "land";

window.__oc = { showIncident, runMove, showDebrief, showEnd, showIntro, openNotes, INC, app };
showIntro();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
