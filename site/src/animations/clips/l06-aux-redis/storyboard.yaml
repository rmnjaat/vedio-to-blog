# Storyboard — clip l06-aux-redis (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l06-aux-redis
title: Thirty messages, one write
lecture: 8
section: "6.2 The auxiliary database"
status: reviewed     # draft | approved | built | reviewed
why_motion: >
  Accumulation and rate: the lesson is wasted writes piling onto the one component the class says you cannot
  afford to lose. A still can state "29 of 30 writes change nothing" (Fig 6·a does); only motion shows the main
  store's tray filling with red no-change hits, message after message, in one setup, while in the other the same
  burst piles up as checks on the auxiliary store and the main store gets a single write per sender.
static_twin: "Fig 6·a (where the load goes) and StepThrough Fig 6·b (first message vs repeats); board D-13 (b_024045.jpg): status update workers with lines to the Redis cluster and to a pink 'Auxiliary Redis' holding 'B_C : True / B_D : True', 'B : {C, D}' beside the cluster"
ledger:
  taught:
    - L-0286  # the N-1 repeats still call the DB although the set already holds the sender (top lane, red x per repeat)
    - L-0292  # aux write flow: check aux first; exists -> no write to main; new -> write to main (bottom lane)
    - L-0293  # with aux, main is not even called for the n-1 repeats; aux takes the hitting (bottom lane, B3/B4)
    - L-0303  # aux is for checking, not storing: one write to aux, one to main per sender, the rest existence checks
  context_only:
    - L-0284  # set semantics: only the first message from a sender changes the set (B1 caption, green dot)
    - L-0285  # friends send 5, 10, ... 30 short messages while you are offline (B0 caption; C x30, D x20)
    - L-0288  # minimise no-change operations, the DB is the most brittle component (B5 caption)
    - L-0290  # use an auxiliary database to absorb them (lane title "with aux")
    - L-0302  # aux key model B_C : True (the B_C / B_D entries)
fidelity_notes:
  - "Recipient B, senders C and D, and the entries 'B : {C, D}' / 'B_C', 'B_D' follow the board (D-13, b_024045.jpg). The main store's set is written 'B:{C}' then 'B:{C,D}'; the aux entries are shown as keys only ('B_C'), the board's ': True' value is dropped for space."
  - "30 messages from C is the top of the teacher's '5, 10, 15, 20, 30' (L-0285); 20 from D is another value from the same list. Every dot in a tray is one message; the counts on screen (29, 48 no change; 29, 48 checks; 1, 2 writes) are arithmetic on those two bursts, not measured numbers."
  - "No load gauge and no ops/s: the plan's qualitative gauge is replaced by one mark per message that reaches a store (green dot = the set changed, red x = reached main and changed nothing, graphite ring = an existence check on aux). Nothing claims main fails at some threshold."
  - "The aux step is labelled only as a check; the fact-check's atomic set-if-absent (A-PTU-14, SET B_C 1 NX) is left to Fig 6·b and prose. The aux store's reply ('new' / 'exists') is not drawn as a packet: the worker writing main only after the first check stands for it."
  - "The work is moved, not removed: the bottom lane shows every repeat landing on aux (fact-check L-0291: total operations are not reduced, the duplicates go to a separate store). The extra hop's cost (L-0291), failure of either store (L-0294) and inconsistency (L-0296, L-0305) stay in 6.3 prose and figures."
  - "The repeats are sped up (one every 4 frames); the queue (ON_MSG_UNSENT) between sender and worker is folded into the 'C xN' sender box. The worker is drawn once per lane, not a fleet."
  - "B4 runs the same D burst in both lanes at once (the repeats only), after each lane's first message has been shown on its own: the caption is about the contrast, and both streams are one event (the same burst)."
