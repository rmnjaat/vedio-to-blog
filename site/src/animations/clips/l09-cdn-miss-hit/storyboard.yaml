# Storyboard — clip l09-cdn-miss-hit (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l09-cdn-miss-hit
title: One fetch, then thousands of hits
lecture: 7          # course position 07 (folder lec09)
section: "2.3 Miss, hit, and \"it's all bytes\""
status: reviewed    # draft | approved | built | reviewed
why_motion: >
  Accumulation / rate, plus a window. The lesson is how often the origin hears about a photo: once, on the first
  request, and then not at all while thousands of requests are answered from the CDN's copy, until that copy expires
  and one request refills it (L-0043 "a few requests every time the cache invalidates"). A still shows two arrows
  (Fig 2·b); only the two counters diverging over time, and the one fetch per expiry, show the rate.
static_twin: "Fig 2·b (D-02 redraw: user — cdn — origin, empty cache slot), with the user drawn as three viewers; board b_001200.jpg"
ledger:
  taught:
    - L-0036  # first request: nothing cached, the CDN itself requests the same path from the origin, caches it, returns it
    - L-0037  # next request for the same path: served directly from the cached copy
    - L-0038  # that is all a CDN does: cached data if it has it, otherwise the same path from the origin
    - L-0043  # requests never reach the backend when the CDN has the content; only a few each time the cache invalidates
  context_only:
    - L-0034  # host swap (a.mycdn.net → arpitbhayani.me, same path): shown only as the host under each glyph
    - L-0058  # TTL: the copy is kept until the TTL expires (the 'ttl' bar); invalidation API stays in §2.6 prose
    - L-0044  # cost: prose after the clip
fidelity_notes:
  - "Counts are illustrative, not class numbers: the cdn counter reaches 1,000 at the end of the hits beat and 1,200 at the end; the origin counter goes 1 then 2. The class gave no numbers here; captions say 'every later request' and 'over a thousand views', not a measured figure."
  - "The stream of hits is drawn thinned: about a dozen request dots are played, and the counter carries the count."
  - "The request is labelled mono 'GET logo.png' on both legs (the path is shortened from /system-design/logo.png to fit the 22-character label rule; Fig 2·c, right before the clip, shows the full URLs). The hosts are written under the glyphs as on the board: a.mycdn.net under the cdn, arpitbhayani.me under the origin. Same label on both legs = same path (L-0036, L-0038)."
  - "No TTL value is shown (CloudFront's 24 h default, A-CDM-04, stays in prose). The ttl bar drains at a steady rate from the moment the copy is stored; time is compressed and the clip says '(not to scale)' in a corner."
  - "One edge node only: geography (L-0039) is not claimed. One request refills the copy after expiry: the clip's simplification of 'a few requests every time the cache invalidates' (L-0043); the final caption keeps 'a few'."
  - "The fact-check caveat on L-0036/L-0040 (only cacheable responses are stored; origin Cache-Control and the CDN's cache policy decide) is NOT shown in the clip; it sits in the prose right after it. The clip never says 'any response' is cached."
  - "The miss leg (cdn → origin) is graphite, not red: a miss is the CDN working as designed. The CDN pulls: the arrow starts at the cdn, head at the origin; the bytes come back along the same line as a green chip (the reply), never as an arrow into the CDN (figures.md direction rules)."
  - "Not claimed: invalidation API, versioned names, private content, cost."
