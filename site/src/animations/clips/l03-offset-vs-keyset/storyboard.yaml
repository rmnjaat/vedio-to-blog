# Storyboard — clip l03-offset-vs-keyset (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l03-offset-vs-keyset
title: Page 1, page 10, page 1,000
lecture: 3          # folder lec03, course position 06 ("Lecture 06")
section: "8.2 Why offset gets slower as you go"
status: reviewed    # draft | approved | built | reviewed
why_motion: >
  Accumulation: the lesson is that offset's work for one page grows with the page's depth, because every page
  re-walks all the rows before it, while ID-limit's work stays the same. The clip runs the pages one after another
  with the pen at a constant speed, so the offset walk visibly takes longer each page (4 s at page 1,000) while the
  ID-limit seek takes the same short time every page. Fig 8·a shows one deep page; Fig 8·b shows the result curve;
  neither shows the walk starting again from row 1 on every page.
static_twin: "Fig 8·a 'Skip vs seek' (offset walking past rows to the ringed 10 vs a B+ tree descent to the last ID then 10), laid out as a table of pages 1 / 10 / 100 / 1,000; Fig 8·b's rising-vs-flat shape is the end state"
ledger:
  taught:
    - L-0218  # limit-offset is pathetically slow when you paginate deep (B4, B5 'grows with depth')
    - L-0224  # the DB evaluates the query up to the requested point, skips those rows, picks the next n; recomputed every query; cost grows with depth (B2-B5, 'computed, thrown away')
    - L-0228  # fetch the first 10, note the last ID, then id > last ID limit 10, repeat (ID column labels LIMIT 10, id > 90, id > 990, id > 9990)
    - L-0233  # B+ tree in key order: log n to reach the ID, then a sequential read; time does not increase with depth ('log n + 10 rows', 'same at any depth')
  context_only:
    - L-0217  # LIMIT 10 OFFSET 0, 10, 20 ... (the header query; prose 8.1)
    - L-0219  # pages 3-5 fine, 6 slower, 7 slower (prose 8.2, right before the clip)
    - L-0225  # ID-limit pagination is the other way (the lane title 'ID-limit'; prose 8.1)
    - L-0227  # IDs must be comparable (B6 caption; prose 8.3)
    - L-0229  # stored in primary-key order -> SN-15: the index seek is what makes it fast (B6 caption 'an index on them'; prose 8.3)
    - L-0230  # benchmark: skip-limit linear, ID-limit flat (Fig 8·b, prose 8.4)
fidelity_notes:
  - "The lecture's own names: 'limit-offset' and 'ID-limit' (L-0217, L-0225). 'Keyset' appears only in the clip id; nothing on screen says it."
  - "Page size 10 and the depths 1 / 10 / 100 / 1,000 are illustrative (the class gave no depths beyond 'sixth, seventh' and the benchmark's records). The offsets 0 / 90 / 990 / 9990 are just the arithmetic of LIMIT 10 OFFSET 10(k-1); 9990 is Fig 8·a's number."
  - "IDs are drawn as 1, 2, 3 ... with no gaps and no filter, so the last ID of page k is 10k and the ID query for page 10 reads 'id > 90'. Real IDs (Snowflake, ObjectId) have gaps; only their order matters. The sort (ORDER BY id, fact-check A-PEM-01) lives in the page's CodeBlock, not on screen."
  - "The offset strip is to scale for the walked rows (row 1 to 10,000 across the strip); the ring around the ten returned rows is a highlight, not to scale (it is the same width at every depth)."
  - "Pen speed of the offset walk is constant, so its duration is proportional to the rows walked (page 10 is a 4 px walk, page 1,000 the whole strip in 4 s). No response times, no units, no benchmark numbers on screen (the class showed a graph, not reproducible figures)."
  - "The ID-limit seek is drawn as a three-step descent through index nodes (log n, L-0233) into the ten rows. It does not claim the table itself is physically sorted (SN-15: true for InnoDB's clustered key; elsewhere it is the index seek), so it stays true for heap stores too."
  - "Not claimed: that offset is slow at small depths (the clip shows page 1 and page 10 nearly the same, matching L-0230's 'little difference at small depths'); anything about WHERE-clause filters (SN-16 lives in prose 8.5); jumping to page N."
  - "'computed, thrown away' is Fig 8·a's label for L-0224 ('evaluate the entire query ... skip those rows'). 'log n + 10 rows' is L-0233 ('log n to reach that ID, then a sequential scan', LIMIT 10). 'same at any depth' is L-0233's 'no matter how deep you paginate, the time does not increase' (approximately; log n grows slowly, A-PEM-15, prose)."
  - "B6's caption 'It needs IDs you can compare, and an index on them' is L-0227 + L-0229 in the fact-checked wording of SN-15 (index seek), as in clips.json."
