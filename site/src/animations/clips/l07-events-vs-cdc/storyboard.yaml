# Storyboard — clip l07-events-vs-cdc   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l07-events-vs-cdc
title: The same changes, two pipelines
lecture: 9            # course position (folder lec07)
section: "1.3 Change data capture: read the source of truth"
status: reviewed
why_motion: >
  Ordering and a window in time, plus silent accumulation of drift. The event pipeline fails at a moment (after
  the database write, before the publish) and on changes that never produce an event; each miss is invisible when it
  happens and only adds up across changes. CDC's resume is also temporal: it stops, the log keeps growing, and it
  picks up from its checkpoint. A still of the two end tables shows that they differ, not which change went missing
  or why.
static_twin: "Fig 1·b (D-02 redraw: api → kafka → consumer → mysql) and Fig 1·c (D-03 redraw: mongodb + log → cdc → mysql), drawn as one figure with two lanes"
ledger:
  taught:
    - L-0026  # not everything has an event: views++ has none (B2); restated: read the source of truth (B6)
    - L-0028  # board: "changes done but sending event failed" → the API crash (B3); the obvious answer isn't
    - L-0033  # CDC captures updates the app has no event for (B2, B4)
    - L-0034  # API crashes while pushing the event: nothing lost with CDC (B3)
    - L-0040  # resumes from that point once back up (B5)
    - L-0065  # CDC checkpoints what it has captured, in order, so it doesn't lose data (B5 `checkpoint`)
    - L-0346  # async worker aggregating likes: no API event (B4)
  context_only:
    - L-0024  # the event pipeline API → Kafka → consumer → MySQL (the top lane's shape)
    - L-0031  # rely on the source of truth (the rule, stated in 1.3/1.5 prose; the closing caption echoes L-0026's restatement)
    - L-0037  # CDC reads the commit log / binlog (the `log` strip; how it reads is §1.4)
fidelity_notes:
  - "The four changes are the lecture's: blog published (L-0026 'Blog published, okay'), views count++ (L-0026), change saved but event failed (board line, L-0028/L-0034), a worker aggregating likes (L-0346). Their order and the names `post 1`, `post 2` are ours."
  - "The source is `mongodb` as in the lesson's running case (L-0019, Fig 1·c); the log is labelled just `log` (the lecture says commit log / bin log / WAL; MongoDB's is the oplog). How CDC reads it is left to §1.4 and Fig 1·d."
  - "L-0040 says 'in case this DB is down ... once this DB is back up, it will resume from that point'. The clip shows the CDC tool stopped and restarted, the case the fact-check's sources describe (Debezium: after a restart the connector continues reading where it left off; A-CDP-03: the log is retained while the CDC tool is down). The resume is drawn as the read arrow continuing from its last row (L-0065 checkpointing)."
  - "Fact-check L-0040 (simplified): resuming works only if the log still holds the position (A-CDP-03, A-CDP-04: purged binlog → re-snapshot). The clip's downtime is short and says 'the log keeps it'; the caveat stays in §1.4 prose."
  - "Fact-check A-CDP-09: checkpointing prevents loss, not duplicates. The clip shows no delivery guarantee beyond 'copied'; exactly-once is NOT claimed."
  - "Fact-check L-0028 (simplified): events from the API are a common design; the flaw is the dual write. The clip shows the misses, it does not call the event design wrong; the outbox (A-E-08) stays in prose."
  - "The event-carries-only-the-id problem (L-0027) and 'did someone add the event for the new table' (L-0049) are not in the clip (Fig 1·b and prose)."
  - "Consumers pull from Kafka, so the consumer → kafka line has its head at kafka (Fig 1·b); CDC initiates the read, so the cdc → log line has its head at the log; data rides back along it as a packet."
  - "No timings or counts are claimed. `1 of 4` / `4 of 4` count the clip's own four changes."
additions:
  - {fact: "A CDC tool's log position is retained while the tool is down, so it can resume ('the log keeps it')", source_url: "https://debezium.io/documentation/reference/stable/connectors/postgresql.html", ledger_addition: A-CDP-03, checked: 2026-10-13}
