# Storyboard — clip l02-missed-message (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l02-missed-message
title: Lost in real time
lecture: 4            # course position (folder lec02)
section: "9.3 When a real-time message is lost"
status: reviewed      # draft | approved | built | reviewed  (render-check rounds: lectures/lec02/animations/l02-missed-message/review.md)
why_motion: >
  A window in time. The message is lost only because the publish falls inside a short disconnection of WS2, and
  the fix is a later timer event on the same time line. A still can show the parts, but not that the message sat
  in the database all along while E's screen stayed wrong until the timer ran.
static_twin: "Fig 9·b reduced to its real-time + persistence columns (A on ws1, the redis pub/sub pipe, ws2 with E's screen; kafka -> worker -> db; api under E); board D-11 (b_022945.jpg) with its 'What if some messages are not sent in realtime? <- Transient issue' text"
ledger:
  taught:
    - L-0332  # board insight: messages once sent will always be persisted (B1)
    - L-0284  # a server not connected at the moment of publish does not receive it (B2)
    - L-0344  # no persistence in Redis Pub/Sub: only those connected get it, a message can be lost in real time (B2, B3)
    - L-0345  # a small JS thread periodically fetches the last 50 messages and renders any it missed (B4)
    - L-0334  # board: (1) correction job ensures messages are shown (B4 label 'correction job')
    - L-0379  # persistence is guaranteed, the real-time notification is not (B5)
  context_only:
    - L-0282  # Pub/Sub keeps nothing (taught in 8.4; the B2 label 'keeps nothing' repeats it as the reason)
    - L-0333  # clicking the channel loads it through the channel-scroll REST API (prose)
    - L-0338  # the type-2 persistence path ws -> kafka -> workers -> db (Fig 9·b)
    - L-0346  # WhatsApp's 'checking for new messages' (unverifiable reading, prose only)
fidelity_notes:
  - "The disconnection is drawn as a break in WS2's link to the pipe at the moment of the publish. The class says only 'not connected at that moment' (L-0284); the predict line's 'one second' is illustrative and no duration is on screen."
  - "Reduced Fig 9·b: one edge server per side, one worker, one db cylinder, no lb in front of the api (the figure has fleets, a partitioned db and an lb). In this reduced view only WS2 serves c1's other member, so 'Redis pushes to no one' means no connected subscriber for the message."
  - "The persistence path is the type-2 path of the final diagram (L-0338) and the board recap's step 1 'persist message in Kafka': ws1 -> kafka dashed, worker pulls (dashed, head at kafka, hand 'pull'), worker -> db solid. 'Always persisted' (L-0332, fact-check: simplified, low) is shown as green 'saved ✓'; the idempotent-insert caveat (A-MLA-09) stays in the prose."
  - "Kafka keeps its message square after the worker's pull (graphite); the Pub/Sub keeps nothing (L-0282): the two pipes' contrast."
  - "The timer's interval was not given in class: the clock on E's screen shows no number. 'Last 50' is the class's (L-0345); the request is drawn as mono 'GET last 50 (c1)', an HTTP call to the api (the class: a small JavaScript thread periodically fetching the last 50 messages; the board's non-realtime API servers in D-11). The verb GET is a drawing convention, not a claimed endpoint."
  - "'correction job' is the board's wording (L-0334 (1)). The board's second fix, buffering in another Kafka and replaying (L-0334 (2)), is named in the after-sentence, not drawn."
  - "Message text 'standup in 5' is the lecture page's running example message (also used in l02-three-ways-to-persist), not from class; E's earlier messages are drawn as unlabelled grey lines."
  - "'push: not guaranteed' / 'persisted: guaranteed' paraphrase L-0379 ('the notification part is not guaranteed, but the persistence is guaranteed')."
  - "Redis's at-most-once delivery (A-SRW-10) and Redis Streams are in the prose, not on screen. Not claimed: how long a reconnect takes, how often the timer runs, that Slack uses this exact timer."
