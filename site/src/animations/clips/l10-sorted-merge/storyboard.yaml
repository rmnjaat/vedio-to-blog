# Storyboard — clip l10-sorted-merge   (spec: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l10-sorted-merge
title: Two pointers, one pass
lecture: 10
section: "5.3 Merge, as in merge sort"
status: reviewed
why_motion: >
  Ordering / position over time. "One pass, never backwards" is a property of how the two pointers move: each one
  steps forward exactly once per entry and never goes back, so the merge is a single linear pass and holds only the
  two current lines. Fig 5·c shows the merged result; only motion shows the walk.
static_twin: "Fig 5·c (D-08 redraw, b_011745.jpg): ① dictionary, ② changelog, new dictionary, pointer carets left of the columns"
ledger:
  taught: [L-0140, L-0142, L-0143, L-0144, L-0145, L-0310]
  context_only: [L-0139, L-0141, L-0147]
fidelity_notes:
  - "Letters and primes are the board's (a′, c″): letters stand for words, primes for meanings (L-0144 detail). The dictionary has SEVEN entries (a b c d f g h, no e), the changelog three (c″, e′, f″), the new file eight."
  - "e – e′ has no match in the dictionary: it is a new word and the merge writes it in its sorted place (L-0144)."
  - "On a match the dictionary's old line (c – c′, f – f′) is struck through in red and ghosted: its meaning is stale and is not copied (L-0143: the changelog's meaning is written)."
  - "Complexity: the poster writes 'one pass · O(n + m)'. The teacher said O(n) for 'one iteration over both files' (L-0310); factcheck_applied (L-0310) states it as linear, O(n + m), and notes the O(n²) alternative is only the naive approach. The clip uses O(n + m) and does NOT show or claim the O(n²) comparison."
  - "Sortedness is assumed, not argued (L-0139 is context: the page's SourceNote says a hashed changelog would also be linear). The clip claims only that this merge needs sorted inputs to walk forward and that its output is sorted."
  - "'in memory: 2 lines' = the two blue-outlined current lines (L-0145: iterate line by line, do not load the file). The 1 TB size and the 2 TB job disk (L-0147) are not drawn."
  - "Pointer moves are counted on screen (dictionary 7, changelog 3, new file 8 lines). These follow from the board's example, not a number the class stated."
  - "A mono readout under 'in memory: 2 lines' shows the comparison of the two current words (a < c, b < c, c = c, d < e, e < f, f = f), one at a time, replaced in place (L-0143: compare, write the smaller; the plan's beat notation). It is hidden once the changelog is used up: g and h have no rival."
  - "The dictionary gets a dashed empty slot after h (mirroring the board's empty changelog arrow) so its pointer's last move lands on a visible end, not on blank paper. No label is written in it."
  - "Changelog-sourced rows get a thin graphite connector from the changelog row to the new row (as in Fig 5·c) and a green ✓; dictionary rows are simply written. Rows are not to scale: each stands for one line of a 1 TB file."
