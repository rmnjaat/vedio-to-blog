# Storyboard — clip l02-three-ways-to-persist (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l02-three-ways-to-persist
title: Three guarantees
lecture: 4            # course position (folder lec02)
section: "7.3 Three ways to persist a message"
status: reviewed      # draft | approved | built | reviewed
why_motion: >
  The lesson is an ordering in time and a window: on path 1 the message is saved before anyone sees it, on path 2
  it is shown at once and saved only after a lag, on path 3 it is shown and never saved. A reload that lands inside
  path 2's lag window hides a message B has already seen; the same reload after the worker's write finds it. Fig 7·c
  shows the routes; only time shows which mark comes first and that the reload falls inside the window.
static_twin: "Fig 7·c (D-04 redraw), phone form: three strips, one per path, each with only its own parts; TradeoffTable T4"
ledger:
  taught:
    - L-0204  # three types on one system, picked by guarantee; Slack = hypothesis, WhatsApp hypothetical (lane titles)
    - L-0206  # type 1: broadcast only after persisting (B1: saved, then shown)
    - L-0209  # type 1 flow: HTTP -> api -> db, then api -> edge (WebSocket server) -> users
    - L-0210  # send over HTTP, receive over WebSocket (HTTP arrow in, WS line out)
    - L-0214  # type 2: WS -> edge -> other user now, -> kafka -> db later
    - L-0218  # 10-minute persistence lag; a Slack user reloading from the db does not see it (B4)
    - L-0219  # different guarantees, different architecture (B6)
    - L-0220  # type 3 Zoom chat: only whoever is connected gets it, no persistence
    - L-0221  # leave and come back: no history (B3 'rejoin', 'history gone'), softened 'by default'
    - L-0389  # delivered now, stored late (B2 shown at once; B5 saved later)
    - L-0390  # delayed processing: source of truth lacks it; a reload hides a seen message (B4)
  context_only:
    - L-0205  # the parts (edge server = WebSocket server); named in prose and the NotationKey
    - L-0211  # WhatsApp keeps a copy on the device and has no backend copy (why lane 2 is 'hypothetical')
    - L-0213  # Slack users keep no local copy (prose)
    - L-0215  # async is fine when the device holds a copy (prose)
    - L-0216  # no synchronous db call, batch writes (prose)
    - L-0222  # pick by how critical persistence is (RuleBox)
    - L-0386  # Kafka is pulled: the worker -> kafka arrow direction
fidelity_notes:
  - "Lane 1 is titled 'Slack' with '(a hypothesis)' (L-0204: 'my hypothesis, I may be wrong'). Persist-then-broadcast is the class's type 1, not Slack's published path; A-MLA-03 (Slack's real send path has more tiers and does not say the write completes first) stays in prose."
  - "Lane 2 is 'WhatsApp-like' with '(hypothetical)': WhatsApp keeps no backend copy (L-0211, prose)."
  - "The lane-2 reload is the class's 'imagine Slack' scenario (L-0218): a client that reads the channel back from the database. WhatsApp clients read their device copy, so it works there (L-0215, L-0218). The B4 caption says so: 'If B reloads from the DB in the lag (a Slack client can)'."
  - "Lane 3 is 'Zoom chat' with '(by default)': the softening from the fact-check of L-0220/L-0221 (A-MLA-12, continuous meeting chat persists). Its reload is drawn as 'rejoin' (leave and come back), which is what L-0221 describes."
  - "The lag is the class's example ('let's say it takes 10 minutes', L-0218), written '≈ 10 min lag' with 'not to scale' under it: the window is a short bar and the clip does not run for ten minutes. The reload moment inside it (red tick) is illustrative."
  - "Fig 7·c's load balancer, API fleet and three shards are reduced to one 'api' box and one 'db' cylinder; Kafka's three workers to one 'worker'. The edge server is labelled mono 'edge' (the page names it 'edge server', a WebSocket server, L-0205)."
  - "On reload B is drawn reading the db directly (arrow from B's screen to the db). In class the client reads messages from the database through the API (L-0218); the API hop is omitted for room."
  - "Board colours (white / green / blue paths) are not used; paths are numbered 1-3 as on the board. Blue = the message travelling or a read, green = saved / found, red = not stored yet / history gone."
  - "Not shown: Kafka retention, idempotent inserts, batching (L-0216, prose), the grey -> black 'sent' observation (7.2), any timing number other than the class's 10 minutes, that the final diagram uses path 2 (L-0236, prose)."
additions:
  - {fact: "Zoom's in-meeting chat shows only messages sent while you are present by default; continuous meeting chat can persist them", source_url: "https://www.zoom.com/en/blog/continuous-meeting-chat", checked: 2026-10-13, used_as: "'(by default)' in lane 3's title (A-MLA-12)"}
