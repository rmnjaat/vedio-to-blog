# Storyboard — clip l03-clock-skew (format: .claude/skills/explainer-animation/references/storyboard-spec.md)
id: l03-clock-skew
title: Four clocks, four requests
lecture: 3          # folder lec03, course position 06 ("Lecture 06")
section: "3.5 Four machines, four clocks"
status: reviewed    # draft | approved | built | reviewed
why_motion: >
  Ordering / interleaving: the lesson is the clash between two orders, the order the requests happen in (real time)
  and the order their IDs sort in. The clip plays the requests one by one, so the ID list grows down the real-time
  axis and the reader sees the ID go down at the moment it happens (237 after 244). A still shows four numbers and
  leaves the reader to rebuild the arrival order.
static_twin: "none on the page (the former StepThrough was removed by the design fix, C-04); the clip-as-text covers no-motion readers. Source: board D-08 (b_003700.jpg / b_003812.jpg): four laptops 2, 4, 7, 9 with 'time: 23 / 24 / 23 / 23' under them, and the list 'get_id on m2 -> 232' ... in call order"
ledger:
  taught:
    - L-0071  # machines 2, 4, 7, 9 at 23, 24, 23, 23; requests in order to m2, m4, m7, m9 give 232, 244, 237, 239: not monotonically increasing
    - L-0072  # where order is needed, clock skew must be handled: it affects correctness (final caption)
  context_only:
    - L-0062  # clocks are not perfectly synchronized (prose 3.4; B0's 'their clocks disagree' restates it)
    - L-0070  # even with periodic NTP sync a clock can be off when an ID is made (prose 3.4)
    - L-0073  # strict monotonicity across distributed generators is 'almost impossible' (prose after the clip)
fidelity_notes:
  - "Machines 2, 4, 7, 9, clocks 23, 24, 23, 23, the call order m2, m4, m7, m9 and the IDs 232, 244, 237, 239 are the class's numbers (L-0071, board D-08). The instructor said the times are small stand-ins for epoch milliseconds ('I'm just using smaller numbers'); the clip shows them as 'time: 23' like the board and claims no unit."
  - "ID = time, then machine ID, concatenated (L-0071, building on L-0055). The time digits of each ID get a thin underline (the same cue as Fig 3·b's heavy underline under the time part). No bit layout or real millisecond values."
  - "The board writes the machines' names as '2', '4', '7', '9' over the laptops and 'm2', 'm4' ... in the list; the clip writes 'm2' etc. in both places so the list row and its laptop read as the same machine."
  - "Real time runs down the list (the board's list is in call order, top to bottom, and the board's red down-arrow beside it); the axis is labelled 'real time' and has no scale: the requests are one after another, nothing about how far apart."
  - "Each request is a short blue arrow into its laptop (the get_id call) plus a blue re-ink of the laptop; the call's origin is not drawn (the lecture names no caller)."
  - "The ring on 'time: 24' and the hand 'ahead' mark the cause; it states only what the numbers show (24 > 23). Not claimed: how far clocks drift, why (temperature: SN-01 lives in prose 3.4), or how NTP corrects them (SN-02, prose 3.6)."
  - "'smaller than 244' and 'not monotonically increasing' are the board's words (D-08)."
  - "The final caption is L-0072 in the lecture's terms ('it affects the correctness of a system'). The 'almost impossible' conclusion (L-0073, hedged) stays in prose, not in the clip."
